<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanban</title>
<script type="module">

/* ════════════════════════════════════════════
   CONFIGURAÇÃO — preencha só estes 3 valores
   (instruções no final do arquivo)
════════════════════════════════════════════ */
const SUPABASE_URL     = https://hthpkexccocbncbhebcr.supabase.co/rest/v1/;
const SUPABASE_ANON_KEY= sb_publishable_QyF550xnqhipiSdWs6kmrg_I4jOF_dI;
const APP_PASSWORD     = TesteFamiliar123;

import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  realtime: { params: { eventsPerSecond: 20 } },
  auth: { persistSession: true, storageKey: 'kanban_session' }
});

/* ════════════════════════════════════════════
   CONSTANTES
════════════════════════════════════════════ */
const PALETTE = [
  '#60A5FA','#818CF8','#A78BFA','#F472B6','#FB7185',
  '#FBBF24','#34D399','#2DD4BF','#F97316','#E879F9',
  '#94A3B8','#C084FC'
];

const SESSION_KEY = 'kanban_unlocked';

/* ════════════════════════════════════════════
   ESTADO LOCAL (cache — fonte de verdade = Supabase)
════════════════════════════════════════════ */
let boards        = [];
let currentBoard  = null;
let cols          = [];
let cards         = [];
let cardLabels    = {};   // { card_id: [label_id, …] }
let labels        = [];
let historyItems  = [];
let onlineUsers   = {};   // { uid: { name, ts } }
let editingUsers  = {};

// UI
let dragCardId      = null;
let ctxCardId       = null;
let ctxColId        = null;
let editingCardId   = null;
let activeFilters   = new Set();
let selectedPriority = 'medium';
let selectedTags    = [];
let modalColId      = null;
let colorTargetId   = null;
let realtimeChannel = null;
let presenceInterval= null;

// Identidade leve (sem auth real — apenas nome de sessão)
let myName = '';
const myUid = 'u_' + Math.random().toString(36).slice(2, 9);

/* ════════════════════════════════════════════
   UTILS
════════════════════════════════════════════ */
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(s){ const d=new Date(s+'T00:00:00'); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}); }
function hexAlpha(h,a){ const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16); return `rgba(${r},${g},${b},${a})`; }
function initials(n){ return (n||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); }
function userColor(id){ const c=['#6C63FF','#34D399','#FBBF24','#FB7185','#60A5FA','#A78BFA']; let h=0; for(let ch of(id||'')) h=(h+ch.charCodeAt(0))%c.length; return c[h]; }
function relTime(iso){ const s=Math.floor((Date.now()-new Date(iso))/1000); if(s<60)return 'agora mesmo'; if(s<3600)return Math.floor(s/60)+'m atrás'; if(s<86400)return Math.floor(s/3600)+'h atrás'; return Math.floor(s/86400)+'d atrás'; }

function setSyncing(){ const d=document.getElementById('syncDot'); if(d){d.className='sync-dot syncing';d.title='Salvando…';} }
function setSynced(){  const d=document.getElementById('syncDot'); if(d){d.className='sync-dot';d.title='Sincronizado';} }
function setSyncErr(){ const d=document.getElementById('syncDot'); if(d){d.className='sync-dot error';d.title='Erro';} }

function toast(msg, err=false){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.borderColor=err?'var(--red)':'var(--border)';
  t.classList.add('show');
  clearTimeout(t._t);
  t._t=setTimeout(()=>t.classList.remove('show'),2400);
}

/* ════════════════════════════════════════════
   AUTH — senha compartilhada simples
════════════════════════════════════════════ */
function isUnlocked(){
  return sessionStorage.getItem(SESSION_KEY) === 'true';
}

function checkPassword(input){
  return input === APP_PASSWORD;
}

async function tryUnlock(){
  const input = document.getElementById('passwordInput').value;
  const errEl = document.getElementById('passwordError');
  const btn   = document.getElementById('unlockBtn');

  if(!checkPassword(input)){
    errEl.textContent = 'Senha incorreta. Tente novamente.';
    document.getElementById('passwordInput').classList.add('shake');
    setTimeout(()=>document.getElementById('passwordInput').classList.remove('shake'), 500);
    return;
  }

  // Senha correta — autentica anonimamente no Supabase para RLS funcionar
  errEl.textContent = '';
  btn.textContent = 'Conectando…';
  btn.disabled = true;

  const { error } = await sb.auth.signInAnonymously();
  if(error){
    // Ignora "already registered/logged in" — sessão já existe, segue
    const msg = error.message || '';
    if(!msg.includes('already') && !msg.includes('registered') && !msg.includes('logged')){
      errEl.textContent = 'Erro de conexão: ' + msg;
      btn.textContent = 'Entrar';
      btn.disabled = false;
      return;
    }
  }

  const name = document.getElementById('nameInput').value.trim();
  myName = name || 'Usuário';
  sessionStorage.setItem(SESSION_KEY, 'true');
  sessionStorage.setItem('kanban_name', myName);

  document.getElementById('authGate').classList.add('hidden');
  document.getElementById('appShell').style.display = 'flex';
  initApp();
}

function handlePasswordKey(e){ if(e.key==='Enter') tryUnlock(); }

/* ════════════════════════════════════════════
   INIT
════════════════════════════════════════════ */
async function initApp(){
  // Garante sessão anônima ativa
  const { data: { session } } = await sb.auth.getSession();
  if(!session){
    const { error } = await sb.auth.signInAnonymously();
    if(error){ toast('Erro de conexão', true); setSyncErr(); return; }
  }

  const params = new URLSearchParams(window.location.search);
  const sharedId = params.get('board');

  const { data, error } = await sb.from('boards').select('*').order('created_at');
  if(error){ toast('Erro ao carregar quadros', true); setSyncErr(); return; }

  boards = data || [];

  if(!boards.length){
    await createDefaultBoard();
    return;
  }

  const target = sharedId && boards.find(b=>b.id===sharedId) ? sharedId : boards[0].id;
  await switchBoard(target);
}

async function createDefaultBoard(){
  const { data: board, error } = await sb.from('boards').insert({ name: 'Meu Kanban' }).select().single();
  if(error){ toast('Erro ao criar quadro inicial', true); return; }

  await sb.from('board_cols').insert([
    { board_id: board.id, title:'A fazer',      color:'#7B82A0', position:0 },
    { board_id: board.id, title:'Em progresso', color:'#6C63FF', position:1 },
    { board_id: board.id, title:'Concluído',    color:'#34D399', position:2 },
  ]);
  await sb.from('labels').insert([
    { board_id: board.id, name:'Design',   color_bg:'#1E3A5F', color_text:'#60A5FA', color_dot:'#60A5FA' },
    { board_id: board.id, name:'Backend',  color_bg:'#3D2A0A', color_text:'#FBBF24', color_dot:'#FBBF24' },
    { board_id: board.id, name:'Bug',      color_bg:'#2D0E1A', color_text:'#FB7185', color_dot:'#FB7185' },
    { board_id: board.id, name:'Feature',  color_bg:'#1E1A40', color_text:'#A78BFA', color_dot:'#A78BFA' },
  ]);

  boards = [board];
  await switchBoard(board.id);
}

/* ════════════════════════════════════════════
   SWITCH BOARD
════════════════════════════════════════════ */
async function switchBoard(id){
  if(realtimeChannel){ await sb.removeChannel(realtimeChannel); realtimeChannel=null; }
  stopPresence();

  currentBoard = boards.find(b=>b.id===id) || null;
  if(!currentBoard) return;

  document.getElementById('boardNameInput').value = currentBoard.name;
  renderBoardList();
  closeSidebar();
  setSyncing();

  const [colsR, cardsR, labelsR, clR, histR] = await Promise.all([
    sb.from('board_cols').select('*').eq('board_id',id).order('position'),
    sb.from('cards').select('*').eq('board_id',id).order('position'),
    sb.from('labels').select('*').eq('board_id',id),
    sb.from('card_labels').select('*').eq('board_id',id),
    sb.from('history').select('*').eq('board_id',id).order('created_at',{ascending:false}).limit(60),
  ]);

  cols         = colsR.data  || [];
  cards        = cardsR.data || [];
  labels       = labelsR.data|| [];
  historyItems = histR.data  || [];
  cardLabels   = {};
  (clR.data||[]).forEach(cl=>{
    if(!cardLabels[cl.card_id]) cardLabels[cl.card_id]=[];
    cardLabels[cl.card_id].push(cl.label_id);
  });

  setSynced();
  render();
  renderBoardList();
  subscribeRealtime(id);
  startPresence(id);
}

/* ════════════════════════════════════════════
   REALTIME
════════════════════════════════════════════ */
function subscribeRealtime(boardId){
  realtimeChannel = sb.channel(`board:${boardId}`)
    // cards
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'cards',filter:`board_id=eq.${boardId}`}, p=>{
      if(!cards.find(c=>c.id===p.new.id)) cards.push(p.new); render();
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'cards',filter:`board_id=eq.${boardId}`}, p=>{
      const i=cards.findIndex(c=>c.id===p.new.id); if(i>=0)cards[i]=p.new; else cards.push(p.new); render();
    })
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'cards',filter:`board_id=eq.${boardId}`}, p=>{
      cards=cards.filter(c=>c.id!==p.old.id); render();
    })
    // cols
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'board_cols',filter:`board_id=eq.${boardId}`}, p=>{
      if(!cols.find(c=>c.id===p.new.id)) cols.push(p.new); cols.sort((a,b)=>a.position-b.position); render();
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'board_cols',filter:`board_id=eq.${boardId}`}, p=>{
      const i=cols.findIndex(c=>c.id===p.new.id); if(i>=0)cols[i]=p.new; else cols.push(p.new); cols.sort((a,b)=>a.position-b.position); render();
    })
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'board_cols',filter:`board_id=eq.${boardId}`}, p=>{
      cols=cols.filter(c=>c.id!==p.old.id); render();
    })
    // labels
    .on('postgres_changes',{event:'*',schema:'public',table:'labels',filter:`board_id=eq.${boardId}`}, async ()=>{
      const {data}=await sb.from('labels').select('*').eq('board_id',boardId);
      labels=data||[]; render();
    })
    // card_labels
    .on('postgres_changes',{event:'*',schema:'public',table:'card_labels',filter:`board_id=eq.${boardId}`}, async ()=>{
      const {data}=await sb.from('card_labels').select('*').eq('board_id',boardId);
      cardLabels={}; (data||[]).forEach(cl=>{ if(!cardLabels[cl.card_id])cardLabels[cl.card_id]=[]; cardLabels[cl.card_id].push(cl.label_id); }); render();
    })
    // history
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'history',filter:`board_id=eq.${boardId}`}, p=>{
      historyItems.unshift(p.new); if(historyItems.length>60)historyItems.pop();
    })
    // board rename
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'boards',filter:`id=eq.${boardId}`}, p=>{
      currentBoard={...currentBoard,...p.new};
      document.getElementById('boardNameInput').value=p.new.name;
      boards=boards.map(b=>b.id===boardId?{...b,...p.new}:b);
      renderBoardList();
    })
    // presença (broadcast)
    .on('broadcast',{event:'presence'}, ({payload})=>{
      if(payload.uid!==myUid){
        onlineUsers[payload.uid]=payload;
        renderPresenceBar();
      }
    })
    .on('broadcast',{event:'editing'}, ({payload})=>{
      if(payload.uid!==myUid){
        editingUsers[payload.uid]=payload;
        renderEditingIndicator();
        clearTimeout(editingUsers[payload.uid]?._t);
        if(editingUsers[payload.uid]) editingUsers[payload.uid]._t=setTimeout(()=>{ delete editingUsers[payload.uid]; renderEditingIndicator(); },5000);
      }
    })
    .on('broadcast',{event:'offline'}, ({payload})=>{
      delete onlineUsers[payload.uid]; renderPresenceBar();
    })
    .subscribe();
}

/* ════════════════════════════════════════════
   PRESENÇA
════════════════════════════════════════════ */
function startPresence(boardId){
  if(!realtimeChannel) return;
  const send=()=>realtimeChannel.send({
    type:'broadcast', event:'presence',
    payload:{ uid:myUid, name:myName, board_id:boardId, ts:Date.now() }
  });
  send();
  presenceInterval=setInterval(send, 20000);
}

function stopPresence(){
  clearInterval(presenceInterval); presenceInterval=null;
  if(realtimeChannel) realtimeChannel.send({type:'broadcast',event:'offline',payload:{uid:myUid}});
  onlineUsers={}; renderPresenceBar();
}

function signalEditing(){
  if(!realtimeChannel||!currentBoard) return;
  realtimeChannel.send({type:'broadcast',event:'editing',payload:{uid:myUid,name:myName,board_id:currentBoard.id}});
}

function renderPresenceBar(){
  const bar=document.getElementById('presenceBar');
  if(!bar) return;
  bar.innerHTML=Object.values(onlineUsers).slice(0,5).map(u=>
    `<div class="presence-avatar-initials" style="background:${userColor(u.uid)}" title="${esc(u.name||'')} • online">${initials(u.name)}</div>`
  ).join('');
}

function renderEditingIndicator(){
  const el=document.getElementById('editingIndicator');
  if(!el) return;
  const others=Object.values(editingUsers).filter(u=>u.board_id===currentBoard?.id);
  if(others.length){ el.style.display=''; el.textContent=others.map(u=>(u.name||'').split(' ')[0]).join(', ')+' editando…'; }
  else el.style.display='none';
}

/* ════════════════════════════════════════════
   LOG HISTORY
════════════════════════════════════════════ */
async function logHistory(action, detail){
  if(!currentBoard) return;
  await sb.from('history').insert({ board_id:currentBoard.id, user_name:myName, action, detail });
}

/* ════════════════════════════════════════════
   RENDER
════════════════════════════════════════════ */
function render(){
  const bd=document.getElementById('board');
  if(!bd) return;
  bd.innerHTML='';
  const q=(document.getElementById('searchInput')?.value||'').toLowerCase();

  cols.forEach(col=>{
    const colCards=cards.filter(c=>{
      if(c.col_id!==col.id) return false;
      if(activeFilters.size && !activeFilters.has(c.priority)) return false;
      if(q && !(c.title||'').toLowerCase().includes(q) && !(c.description||'').toLowerCase().includes(q)) return false;
      return true;
    });
    const total=cards.filter(c=>c.col_id===col.id).length;
    const isLast=cols[cols.length-1]?.id===col.id;
    const pct=isLast&&total?100:0;

    const wrap=document.createElement('div');
    wrap.className='col-wrap';
    wrap.dataset.colId=col.id;
    wrap.innerHTML=`
      <div class="col-header">
        <span class="col-dot" style="background:${col.color}"></span>
        <input class="col-title" value="${esc(col.title)}" onchange="renameCol('${col.id}',this.value)" spellcheck="false">
        <span class="col-count">${total}</span>
        <button class="col-menu" onclick="colMenu(event,'${col.id}')">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="3" r="1.2" fill="currentColor"/><circle cx="7" cy="7" r="1.2" fill="currentColor"/><circle cx="7" cy="11" r="1.2" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="col-progress"><div class="col-progress-fill" style="width:${pct}%;background:${col.color}"></div></div>
      <div class="col-body" id="body-${col.id}"
        ondragover="onDragOver(event,'${col.id}')"
        ondrop="onDrop(event,'${col.id}')"
        ondragleave="onDragLeave(event)">
        ${colCards.map(c=>cardHTML(c)).join('')}
        <button class="add-card-btn" onclick="openAddCardInCol('${col.id}')">
          <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M5.5 1v9M1 5.5h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          Adicionar card
        </button>
      </div>`;
    bd.appendChild(wrap);
  });

  const btn=document.createElement('button');
  btn.className='add-col-btn';
  btn.innerHTML=`<svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 1v10M1 6.5h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg> Nova coluna`;
  btn.onclick=openAddCol;
  bd.appendChild(btn);
  attachDrag();
}

function cardHTML(c){
  const tagIds=cardLabels[c.id]||[];
  const tagsHtml=tagIds.map(tid=>{ const l=labels.find(x=>x.id===tid); if(!l)return ''; return `<span class="tag" style="background:${l.color_bg};color:${l.color_text}">${esc(l.name)}</span>`; }).join('');
  const dateStr=c.due_date?fmtDate(c.due_date):'';
  const overdue=c.due_date&&new Date(c.due_date)<new Date()&&cols[cols.length-1]?.id!==c.col_id;
  return `
    <div class="card" id="card-${c.id}" draggable="true" data-card-id="${c.id}"
      ondblclick="openEditCard('${c.id}')" oncontextmenu="showCtxMenu(event,'${c.id}')">
      <div class="card-top">
        <span class="card-priority p-${c.priority||'medium'}"></span>
        <span class="card-title">${esc(c.title)}</span>
        <button class="card-menu-btn" onclick="showCtxMenu(event,'${c.id}')">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><circle cx="6.5" cy="2.5" r="1.1" fill="currentColor"/><circle cx="6.5" cy="6.5" r="1.1" fill="currentColor"/><circle cx="6.5" cy="10.5" r="1.1" fill="currentColor"/></svg>
        </button>
      </div>
      ${c.description?`<div class="card-desc">${esc(c.description)}</div>`:''}
      ${tagsHtml?`<div class="card-tags">${tagsHtml}</div>`:''}
      <div class="card-footer"><div class="card-meta">
        ${dateStr?`<span class="card-meta-item" style="${overdue?'color:var(--red)':''}">
          <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><rect x="1" y="2" width="9" height="8" rx="1" stroke="currentColor" stroke-width="1.2"/><path d="M1 4.5h9M3.5 1v2M7.5 1v2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          ${dateStr}</span>`:''}
      </div></div>
    </div>`;
}

/* ════════════════════════════════════════════
   DRAG & DROP
════════════════════════════════════════════ */
function attachDrag(){
  document.querySelectorAll('.card[draggable]').forEach(el=>{
    el.addEventListener('dragstart',()=>{ dragCardId=el.dataset.cardId; setTimeout(()=>el.classList.add('dragging'),0); });
    el.addEventListener('dragend',()=>{ el.classList.remove('dragging'); document.querySelectorAll('.col-body').forEach(b=>b.classList.remove('drag-over')); dragCardId=null; });
  });
}
function onDragOver(e,colId){ e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function onDragLeave(e){ e.currentTarget.classList.remove('drag-over'); }
async function onDrop(e,colId){
  e.preventDefault(); e.currentTarget.classList.remove('drag-over');
  if(!dragCardId) return;
  const card=cards.find(c=>c.id===dragCardId);
  if(!card||card.col_id===colId) return;
  setSyncing(); signalEditing();
  const {error}=await sb.from('cards').update({col_id:colId}).eq('id',dragCardId);
  if(error){ toast('Erro ao mover card',true); setSyncErr(); return; }
  setSynced(); logHistory('card_move',`Card "${card.title}" movido`);
}

/* ════════════════════════════════════════════
   BOARD SIDEBAR
════════════════════════════════════════════ */
function toggleSidebar(){
  const s=document.getElementById('boardSidebar'),ov=document.getElementById('sidebarOverlay'),btn=document.getElementById('logoBtn');
  const open=s.classList.toggle('open'); ov.classList.toggle('show',open); btn.classList.toggle('open',open);
  if(open){ renderBoardList(); setTimeout(()=>document.getElementById('boardSearchInput')?.focus(),220); }
}
function closeSidebar(){ document.getElementById('boardSidebar').classList.remove('open'); document.getElementById('sidebarOverlay').classList.remove('show'); document.getElementById('logoBtn').classList.remove('open'); }

function renderBoardList(q=''){
  const list=document.getElementById('boardList');
  if(!list) return;
  const f=q?boards.filter(b=>(b.name||'').toLowerCase().includes(q.toLowerCase())):boards;
  list.innerHTML=f.map(b=>`
    <div class="board-item ${b.id===currentBoard?.id?'active':''}">
      <span class="board-item-icon" onclick="switchBoard('${b.id}')" style="cursor:pointer">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1" y="1" width="5" height="12" rx="1.5" fill="currentColor" opacity=".8"/><rect x="8" y="1" width="5" height="7" rx="1.5" fill="currentColor" opacity=".5"/><rect x="8" y="10" width="5" height="3" rx="1.5" fill="currentColor" opacity=".3"/></svg>
      </span>
      <span class="board-item-name" onclick="switchBoard('${b.id}')" style="cursor:pointer">${esc(b.name||'Sem nome')}</span>
      <button class="board-item-del" title="Excluir" onclick="deleteBoard('${b.id}')">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M1.5 3.5h10M4.5 3.5V2.5h4v1M5 6v4M8 6v4M2.5 3.5l.8 7.2a1 1 0 0 0 1 .8h4.4a1 1 0 0 0 1-.8l.8-7.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>`).join('');
}
function filterBoards(q){ renderBoardList(q); }
function showCreateForm(){ document.getElementById('createBoardForm').classList.add('show'); setTimeout(()=>document.getElementById('newBoardInput')?.focus(),50); }
function hideCreateForm(){ document.getElementById('createBoardForm').classList.remove('show'); document.getElementById('newBoardInput').value=''; }
function createBoardKey(e){ if(e.key==='Enter')createBoard(); if(e.key==='Escape')hideCreateForm(); }

async function createBoard(){
  const name=document.getElementById('newBoardInput').value.trim();
  if(!name) return;
  setSyncing();
  const {data:board,error}=await sb.from('boards').insert({name}).select().single();
  if(error){ toast('Erro ao criar quadro',true); setSyncErr(); return; }
  await sb.from('board_cols').insert([
    {board_id:board.id,title:'A fazer',color:'#7B82A0',position:0},
    {board_id:board.id,title:'Em progresso',color:'#6C63FF',position:1},
    {board_id:board.id,title:'Concluído',color:'#34D399',position:2},
  ]);
  await sb.from('labels').insert([
    {board_id:board.id,name:'Feature',color_bg:'#1E1A40',color_text:'#A78BFA',color_dot:'#A78BFA'},
    {board_id:board.id,name:'Bug',color_bg:'#2D0E1A',color_text:'#FB7185',color_dot:'#FB7185'},
  ]);
  boards.push(board); hideCreateForm();
  await switchBoard(board.id);
  logHistory('board_create',`Quadro "${name}" criado`);
  toast(`Quadro "${name}" criado`); setSynced();
}

async function deleteBoard(id){
  if(boards.length===1){ toast('Não é possível excluir o único quadro'); return; }
  const b=boards.find(x=>x.id===id);
  if(!confirm(`Excluir "${b?.name}"? Esta ação não pode ser desfeita.`)) return;
  setSyncing();
  await sb.from('boards').delete().eq('id',id);
  boards=boards.filter(x=>x.id!==id);
  if(currentBoard?.id===id) await switchBoard(boards[0].id);
  else renderBoardList();
  toast('Quadro excluído'); setSynced();
}

async function renameCurrent(val){
  if(!val.trim()||!currentBoard) return;
  setSyncing(); signalEditing();
  await sb.from('boards').update({name:val.trim()}).eq('id',currentBoard.id);
  currentBoard.name=val.trim();
  boards=boards.map(b=>b.id===currentBoard.id?{...b,name:val.trim()}:b);
  logHistory('board_rename',`Quadro renomeado para "${val.trim()}"`);
  setSynced();
}

/* ════════════════════════════════════════════
   COLUNAS
════════════════════════════════════════════ */
async function renameCol(id,val){
  if(!val.trim()) return;
  setSyncing(); signalEditing();
  await sb.from('board_cols').update({title:val.trim()}).eq('id',id);
  logHistory('col_rename',`Coluna renomeada para "${val.trim()}"`); setSynced();
}
function colMenu(e,colId){
  e.stopPropagation(); ctxColId=colId; ctxCardId=null;
  const menu=document.getElementById('ctxMenu');
  menu.innerHTML=`
    <button class="ctx-item" onclick="addCardCtxCol('${colId}')"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 1v10M1 6.5h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Adicionar card</button>
    <div class="ctx-divider"></div>
    <button class="ctx-item danger" onclick="deleteCol('${colId}')"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M1.5 3.5h10M4.5 3.5V2.5h4v1M5 6v4M8 6v4M2.5 3.5l.8 7.2a1 1 0 0 0 1 .8h4.4a1 1 0 0 0 1-.8l.8-7.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>Excluir coluna</button>`;
  positionMenu(e);
}
function addCardCtxCol(id){ hideCtxMenu(); openAddCardInCol(id); }
async function deleteCol(colId){
  hideCtxMenu();
  if(!confirm('Excluir coluna e todos os seus cards?')) return;
  setSyncing(); signalEditing();
  await sb.from('board_cols').delete().eq('id',colId);
  logHistory('col_delete','Coluna excluída'); toast('Coluna excluída'); setSynced();
}
async function openAddCol(){
  const name=prompt('Nome da nova coluna:');
  if(!name?.trim()) return;
  setSyncing(); signalEditing();
  const maxPos=Math.max(-1,...cols.map(c=>c.position));
  const colors=['#7B82A0','#6C63FF','#FBBF24','#34D399','#FB7185','#60A5FA'];
  await sb.from('board_cols').insert({board_id:currentBoard.id,title:name.trim(),color:colors[cols.length%6],position:maxPos+1});
  logHistory('col_create',`Coluna "${name.trim()}" criada`); setSynced();
}

/* ════════════════════════════════════════════
   CONTEXT MENU (CARDS)
════════════════════════════════════════════ */
function showCtxMenu(e,cardId){
  e.preventDefault(); e.stopPropagation(); ctxCardId=cardId; ctxColId=null;
  const menu=document.getElementById('ctxMenu');
  menu.innerHTML=`
    <button class="ctx-item" onclick="ctxEdit()"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M8.5 1.5 11.5 4.5l-7 7H2v-3l7-7z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>Editar</button>
    <button class="ctx-item" onclick="ctxDuplicate()"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="4" y="4" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M2 9V3.5A1.5 1.5 0 0 1 3.5 2H9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>Duplicar</button>
    <div class="ctx-divider"></div>
    <button class="ctx-item danger" onclick="ctxDelete()"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M1.5 3.5h10M4.5 3.5V2.5h4v1M5 6v4M8 6v4M2.5 3.5l.8 7.2a1 1 0 0 0 1 .8h4.4a1 1 0 0 0 1-.8l.8-7.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>Excluir</button>`;
  positionMenu(e);
}
function positionMenu(e){ const m=document.getElementById('ctxMenu'); m.classList.add('show'); m.style.left=Math.min(e.clientX,window.innerWidth-190)+'px'; m.style.top=Math.min(e.clientY,window.innerHeight-160)+'px'; }
function hideCtxMenu(){ document.getElementById('ctxMenu').classList.remove('show'); }
function ctxEdit(){ hideCtxMenu(); openEditCard(ctxCardId); }
async function ctxDuplicate(){
  hideCtxMenu();
  const card=cards.find(c=>c.id===ctxCardId); if(!card) return;
  setSyncing(); signalEditing();
  const {data:newCard,error}=await sb.from('cards').insert({board_id:currentBoard.id,col_id:card.col_id,title:card.title+' (cópia)',description:card.description||null,priority:card.priority,due_date:card.due_date||null,position:card.position}).select().single();
  if(error){ toast('Erro ao duplicar',true); setSyncErr(); return; }
  const srcLabels=cardLabels[card.id]||[];
  if(srcLabels.length&&newCard) await sb.from('card_labels').insert(srcLabels.map(lid=>({card_id:newCard.id,label_id:lid,board_id:currentBoard.id})));
  logHistory('card_duplicate',`Card "${card.title}" duplicado`); toast('Card duplicado'); setSynced();
}
async function ctxDelete(){
  hideCtxMenu();
  const card=cards.find(c=>c.id===ctxCardId);
  setSyncing(); signalEditing();
  await sb.from('cards').delete().eq('id',ctxCardId);
  logHistory('card_delete',`Card "${card?.title}" excluído`); toast('Card excluído'); setSynced();
}

/* ════════════════════════════════════════════
   CARD MODAL
════════════════════════════════════════════ */
function populateModal(card=null){
  const sel=document.getElementById('mCol');
  sel.innerHTML=cols.map(c=>`<option value="${c.id}" ${card?.col_id===c.id?'selected':''}>${esc(c.title)}</option>`).join('');
  if(modalColId&&!card) sel.value=modalColId;
  document.getElementById('tagPicker').innerHTML=labels.map(l=>`
    <button class="tag-pick-btn ${selectedTags.includes(l.id)?'selected':''}"
      style="background:${l.color_bg};color:${l.color_text};border-color:${selectedTags.includes(l.id)?l.color_text:'transparent'}"
      data-tag="${l.id}" onclick="toggleTag(this,'${l.id}','${l.color_text}')">${esc(l.name)}</button>`).join('');
  document.querySelectorAll('.prio-btn').forEach(b=>b.classList.toggle('selected',b.dataset.p===selectedPriority));
  document.getElementById('mTitle').value=card?.title||'';
  document.getElementById('mDesc').value=card?.description||'';
  document.getElementById('mDate').value=card?.due_date||'';
}
function openNewCard(){ editingCardId=null; modalColId=cols[0]?.id||null; selectedPriority='medium'; selectedTags=[]; document.getElementById('modalTitle').textContent='Novo card'; populateModal(); document.getElementById('modalOverlay').classList.add('show'); setTimeout(()=>document.getElementById('mTitle').focus(),80); }
function openAddCardInCol(colId){ editingCardId=null; modalColId=colId; selectedPriority='medium'; selectedTags=[]; document.getElementById('modalTitle').textContent='Novo card'; populateModal(); document.getElementById('modalOverlay').classList.add('show'); setTimeout(()=>document.getElementById('mTitle').focus(),80); }
function openEditCard(cardId){
  const card=cards.find(c=>c.id===cardId); if(!card) return;
  editingCardId=cardId; modalColId=card.col_id; selectedPriority=card.priority||'medium'; selectedTags=[...(cardLabels[cardId]||[])];
  document.getElementById('modalTitle').textContent='Editar card'; populateModal(card);
  document.getElementById('modalOverlay').classList.add('show'); setTimeout(()=>document.getElementById('mTitle').focus(),80);
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('show'); editingCardId=null; }
function selectPriority(btn){ selectedPriority=btn.dataset.p; document.querySelectorAll('.prio-btn').forEach(b=>b.classList.toggle('selected',b===btn)); }
function toggleTag(btn,id,text){ if(selectedTags.includes(id)){selectedTags=selectedTags.filter(t=>t!==id);btn.classList.remove('selected');btn.style.borderColor='transparent';}else{selectedTags.push(id);btn.classList.add('selected');btn.style.borderColor=text;} }
async function saveCard(){
  const title=document.getElementById('mTitle').value.trim();
  if(!title){ document.getElementById('mTitle').focus(); return; }
  const colId=document.getElementById('mCol').value;
  const desc=document.getElementById('mDesc').value.trim()||null;
  const date=document.getElementById('mDate').value||null;
  setSyncing(); signalEditing();
  if(editingCardId){
    await sb.from('cards').update({title,description:desc,col_id:colId,priority:selectedPriority,due_date:date}).eq('id',editingCardId);
    await sb.from('card_labels').delete().eq('card_id',editingCardId);
    if(selectedTags.length) await sb.from('card_labels').insert(selectedTags.map(lid=>({card_id:editingCardId,label_id:lid,board_id:currentBoard.id})));
    logHistory('card_edit',`Card "${title}" editado`); toast('Card atualizado');
  } else {
    const maxPos=Math.max(-1,...cards.filter(c=>c.col_id===colId).map(c=>c.position));
    const {data:nc,error}=await sb.from('cards').insert({board_id:currentBoard.id,col_id:colId,title,description:desc,priority:selectedPriority,due_date:date,position:maxPos+1}).select().single();
    if(error){ toast('Erro ao criar card',true); setSyncErr(); return; }
    if(selectedTags.length&&nc) await sb.from('card_labels').insert(selectedTags.map(lid=>({card_id:nc.id,label_id:lid,board_id:currentBoard.id})));
    logHistory('card_create',`Card "${title}" criado`); toast('Card criado');
  }
  setSynced(); closeModal();
}

/* ════════════════════════════════════════════
   LABELS MANAGER
════════════════════════════════════════════ */
function openLabelsModal(){ renderLabelsBody(); document.getElementById('labelsOverlay').classList.add('show'); }
function closeLabelsModal(){ document.getElementById('labelsOverlay').classList.remove('show'); hideColorPopover(); }
function renderLabelsBody(){
  document.getElementById('labelsBody').innerHTML=labels.map(l=>`
    <div class="label-row" id="lrow-${l.id}">
      <span class="label-color-dot" style="background:${l.color_dot}" onclick="openColorPicker(event,'${l.id}')"></span>
      <input class="label-name-input" value="${esc(l.name)}" maxlength="24"
        oninput="previewLabelName('${l.id}',this.value)"
        onblur="saveLabelName('${l.id}',this.value)" placeholder="Nome">
      <span class="label-preview" style="background:${l.color_bg};color:${l.color_text}" id="lprev-${l.id}">${esc(l.name)}</span>
      <button class="label-del" onclick="deleteLabel('${l.id}')">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M1.5 3.5h10M4.5 3.5V2.5h4v1M5 6v4M8 6v4M2.5 3.5l.8 7.2a1 1 0 0 0 1 .8h4.4a1 1 0 0 0 1-.8l.8-7.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>`).join('');
}
function previewLabelName(id,val){ const p=document.getElementById('lprev-'+id); if(p)p.textContent=val; }
async function saveLabelName(id,val){
  const l=labels.find(x=>x.id===id); if(!l||l.name===val.trim()) return;
  l.name=val.trim();
  await sb.from('labels').update({name:val.trim()}).eq('id',id);
}
async function addLabel(){
  if(!currentBoard) return;
  const dot=PALETTE[labels.length%PALETTE.length];
  const {data:newL,error}=await sb.from('labels').insert({board_id:currentBoard.id,name:'Nova label',color_bg:hexAlpha(dot,.15),color_text:dot,color_dot:dot}).select().single();
  if(error){ toast('Erro ao criar label',true); return; }
  labels.push(newL); renderLabelsBody();
  const row=document.getElementById('lrow-'+newL.id);
  if(row){ const inp=row.querySelector('.label-name-input'); if(inp){inp.focus();inp.select();} }
}
async function deleteLabel(id){
  await sb.from('card_labels').delete().eq('label_id',id);
  await sb.from('labels').delete().eq('id',id);
  labels=labels.filter(l=>l.id!==id);
  Object.keys(cardLabels).forEach(cid=>{ cardLabels[cid]=(cardLabels[cid]||[]).filter(l=>l!==id); });
  renderLabelsBody(); render();
}
function openColorPicker(e,labelId){
  e.stopPropagation(); colorTargetId=labelId;
  const pop=document.getElementById('colorPopover');
  const l=labels.find(x=>x.id===labelId);
  pop.innerHTML=PALETTE.map(c=>`<span class="color-swatch ${l?.color_dot===c?'selected':''}" style="background:${c}" onclick="applyColor('${c}')"></span>`).join('');
  pop.classList.add('show');
  pop.style.left=Math.min(e.clientX,window.innerWidth-180)+'px';
  pop.style.top=Math.min(e.clientY+8,window.innerHeight-180)+'px';
}
async function applyColor(hex){
  const l=labels.find(x=>x.id===colorTargetId); if(!l) return;
  const bg=hexAlpha(hex,.15); l.color_dot=hex; l.color_text=hex; l.color_bg=bg;
  hideColorPopover();
  await sb.from('labels').update({color_dot:hex,color_text:hex,color_bg:bg}).eq('id',l.id);
  renderLabelsBody(); render();
}
function hideColorPopover(){ document.getElementById('colorPopover').classList.remove('show'); colorTargetId=null; }

/* ════════════════════════════════════════════
   SHARE
════════════════════════════════════════════ */
function openShareModal(){
  document.getElementById('shareLinkInput').value=`${location.origin}${location.pathname}?board=${currentBoard?.id}`;
  document.getElementById('shareOverlay').classList.add('show');
}
function closeShareModal(){ document.getElementById('shareOverlay').classList.remove('show'); }
function copyShareLink(){
  const inp=document.getElementById('shareLinkInput');
  navigator.clipboard.writeText(inp.value).then(()=>toast('Link copiado!')).catch(()=>{ inp.select(); document.execCommand('copy'); toast('Link copiado!'); });
}

/* ════════════════════════════════════════════
   HISTÓRICO
════════════════════════════════════════════ */
const HIST_ICONS={
  card_create:`<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 2v10M2 7h10" stroke="#34D399" stroke-width="1.8" stroke-linecap="round"/></svg>`,
  card_edit:`<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9.5 1.5 12.5 4.5l-8 8H1.5v-3l8-8z" stroke="#A78BFA" stroke-width="1.3" stroke-linejoin="round"/></svg>`,
  card_delete:`<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 4h10M5 4V2.5h4V4M5.5 7v4M8.5 7v4M3 4l.8 7.2a1 1 0 0 0 1 .8h4.4a1 1 0 0 0 1-.8L11 4" stroke="#FF5C6A" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  card_duplicate:`<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="4.5" y="4.5" width="7" height="7" rx="1.5" stroke="#60A5FA" stroke-width="1.3"/><path d="M2 9V3.5A1.5 1.5 0 0 1 3.5 2H9" stroke="#60A5FA" stroke-width="1.3" stroke-linecap="round"/></svg>`,
  card_move:`<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7h10M8 4l3 3-3 3" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
};
const DICON=`<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5" stroke="#7B82A0" stroke-width="1.3"/></svg>`;
function openHistoryModal(){ renderHistoryBody(); document.getElementById('historyOverlay').classList.add('show'); }
function closeHistoryModal(){ document.getElementById('historyOverlay').classList.remove('show'); }
function renderHistoryBody(){
  const body=document.getElementById('historyBody');
  if(!historyItems.length){ body.innerHTML='<p style="color:var(--muted);font-size:13px;padding:8px">Nenhuma atividade ainda.</p>'; return; }
  body.innerHTML=historyItems.map(h=>`
    <div class="history-item">
      <div class="history-initials-sm" style="background:${userColor(h.user_name||'')}">${initials(h.user_name)}</div>
      <span class="history-icon">${HIST_ICONS[h.action]||DICON}</span>
      <div class="history-content">
        <div class="history-text">${esc(h.detail||h.action)}</div>
        <div class="history-meta"><strong>${esc(h.user_name||'?')}</strong> · ${relTime(h.created_at)}</div>
      </div>
    </div>`).join('');
}

/* ════════════════════════════════════════════
   FILTROS
════════════════════════════════════════════ */
function toggleFilter(p,btn){ if(activeFilters.has(p)){activeFilters.delete(p);btn.classList.remove('active');}else{activeFilters.add(p);btn.classList.add('active');} render(); }
function clearFilters(){ activeFilters.clear(); document.querySelectorAll('.filter-chip').forEach(b=>b.classList.remove('active')); const si=document.getElementById('searchInput'); if(si)si.value=''; render(); }

/* ════════════════════════════════════════════
   EVENTOS GLOBAIS
════════════════════════════════════════════ */
document.addEventListener('click',e=>{
  if(!document.getElementById('ctxMenu').contains(e.target)) hideCtxMenu();
  if(!document.getElementById('colorPopover').contains(e.target)&&!e.target.classList.contains('label-color-dot')) hideColorPopover();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ hideCtxMenu(); closeModal(); closeLabelsModal(); closeSidebar(); closeShareModal(); closeHistoryModal(); }
});
['modalOverlay','labelsOverlay','shareOverlay','historyOverlay'].forEach(id=>{
  document.getElementById(id)?.addEventListener('click',e=>{ if(e.target.id===id) document.getElementById(id).classList.remove('show'); });
});
window.addEventListener('beforeunload', stopPresence);

/* ── Expõe funções para onclick inline (necessário com type=module) ── */
Object.assign(window,{
  tryUnlock, handlePasswordKey,
  toggleSidebar, closeSidebar, filterBoards, showCreateForm, hideCreateForm, createBoard, createBoardKey, deleteBoard, renameCurrent, switchBoard,
  openAddCol, renameCol, colMenu, addCardCtxCol, deleteCol,
  showCtxMenu, ctxEdit, ctxDuplicate, ctxDelete,
  openNewCard, openAddCardInCol, openEditCard, closeModal, selectPriority, toggleTag, saveCard,
  openLabelsModal, closeLabelsModal, addLabel, deleteLabel, previewLabelName, saveLabelName, openColorPicker, applyColor,
  openShareModal, closeShareModal, copyShareLink,
  openHistoryModal, closeHistoryModal,
  toggleFilter, clearFilters,
  onDragOver, onDragLeave, onDrop, render,
});

/* ── Boot ── */
if(isUnlocked()){
  myName = sessionStorage.getItem('kanban_name') || 'Usuário';
  document.getElementById('authGate').classList.add('hidden');
  document.getElementById('appShell').style.display='flex';
  initApp();
}
// Se não desbloqueado, authGate permanece visível

</script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0F1117;--surface:#1A1D27;--col:#1E2130;--card:#252A3D;--card-h:#2C3250;
  --border:rgba(255,255,255,0.07);--accent:#6C63FF;--accent-d:#5751E0;
  --text:#E2E4F0;--muted:#7B82A0;--red:#FF5C6A;--r:10px;--r-sm:6px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px;overflow:hidden}
.app{height:100vh;display:flex;flex-direction:column}
.main{flex:1;overflow:hidden;display:flex;flex-direction:column}

/* ── AUTH GATE ── */
#authGate{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:9000}
#authGate.hidden{display:none}
.auth-logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px;letter-spacing:-.5px}
.auth-logo svg{color:var(--accent)}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:32px;width:340px;display:flex;flex-direction:column;gap:16px;box-shadow:0 24px 64px rgba(0,0,0,.5)}
.auth-card h2{font-size:16px;font-weight:600;letter-spacing:-.2px}
.auth-card p{font-size:13px;color:var(--muted);line-height:1.5}
.auth-input{background:var(--col);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 14px;color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border-color .15s;width:100%}
.auth-input:focus{border-color:var(--accent)}
.auth-input.shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.auth-error{font-size:12px;color:var(--red);min-height:16px}
.auth-btn{background:var(--accent);border:none;border-radius:var(--r-sm);padding:11px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s;width:100%}
.auth-btn:hover{background:var(--accent-d)}

/* ── HEADER ── */
.header{display:flex;align-items:center;gap:12px;padding:0 20px;height:52px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;position:relative;z-index:50}
.header-logo-btn{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;letter-spacing:-.3px;background:none;border:none;color:var(--text);cursor:pointer;padding:5px 8px;border-radius:var(--r-sm);font-family:inherit;transition:background .15s}
.header-logo-btn:hover{background:var(--col)}
.header-logo-btn svg{color:var(--accent);flex-shrink:0}
.header-logo-btn .chevron{color:var(--muted);transition:transform .2s}
.header-logo-btn.open .chevron{transform:rotate(180deg)}
.header-divider{width:1px;height:18px;background:var(--border);flex-shrink:0}
.board-name-input{font-size:13px;font-weight:500;color:var(--muted);background:transparent;border:1px solid transparent;border-radius:var(--r-sm);padding:4px 8px;outline:none;font-family:inherit;transition:all .15s;min-width:80px;max-width:260px}
.board-name-input:hover{background:var(--col);color:var(--text)}
.board-name-input:focus{border-color:var(--accent);background:var(--col);color:var(--text)}
.header-actions{margin-left:auto;display:flex;align-items:center;gap:8px}

/* ── PRESENCE ── */
.presence-bar{display:flex;align-items:center;gap:4px}
.presence-avatar-initials{width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0;cursor:default;transition:transform .15s}
.presence-avatar-initials:hover{transform:scale(1.1)}

/* ── SYNC DOT ── */
.sync-dot{width:7px;height:7px;border-radius:50%;background:#34D399;flex-shrink:0;transition:background .3s}
.sync-dot.syncing{background:#FBBF24;animation:pulse .8s ease-in-out infinite}
.sync-dot.error{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.editing-badge{font-size:10px;font-weight:600;color:var(--muted);background:var(--col);border:1px solid var(--border);border-radius:20px;padding:2px 8px;white-space:nowrap}

/* ── BTN ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:var(--r-sm);font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s;font-family:inherit}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--col);color:var(--text)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-d)}
.btn-sm{padding:4px 10px;font-size:12px}

/* ── SIDEBAR ── */
.board-sidebar{position:fixed;top:52px;left:0;bottom:0;width:280px;background:var(--surface);border-right:1px solid var(--border);z-index:200;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .22s cubic-bezier(.4,0,.2,1)}
.board-sidebar.open{transform:translateX(0)}
.sidebar-overlay{position:fixed;inset:0;top:52px;background:rgba(0,0,0,.4);z-index:199;display:none;backdrop-filter:blur(2px)}
.sidebar-overlay.show{display:block}
.sidebar-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px;flex-shrink:0}
.sidebar-head h3{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.8px;text-transform:uppercase}
.sidebar-close{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;border-radius:5px;display:flex;transition:color .15s}
.sidebar-close:hover{color:var(--text);background:var(--col)}
.sidebar-search{margin:0 12px 10px;display:flex;align-items:center;gap:8px;background:var(--col);border:1px solid var(--border);border-radius:var(--r-sm);padding:6px 10px;transition:border-color .15s}
.sidebar-search:focus-within{border-color:var(--accent)}
.sidebar-search input{background:none;border:none;outline:none;color:var(--text);font-size:12px;font-family:inherit;width:100%}
.sidebar-search input::placeholder{color:var(--muted)}
.board-list{flex:1;overflow-y:auto;padding:0 8px;scrollbar-width:thin;scrollbar-color:var(--col) transparent}
.board-list::-webkit-scrollbar{width:4px}
.board-list::-webkit-scrollbar-thumb{background:var(--col);border-radius:2px}
.board-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);cursor:pointer;color:var(--text);font-size:13px;width:100%;transition:background .12s}
.board-item:hover{background:var(--col)}
.board-item.active{background:rgba(108,99,255,.15);color:var(--accent)}
.board-item.active .board-item-icon{color:var(--accent)}
.board-item-icon{color:var(--muted);flex-shrink:0}
.board-item-name{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board-item-del{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;border-radius:4px;display:flex;align-items:center;transition:color .12s,background .12s;flex-shrink:0;opacity:0}
.board-item:hover .board-item-del{opacity:1}
.board-item-del:hover{color:var(--red);background:rgba(255,92,106,.1)}
.sidebar-footer{padding:12px;border-top:1px solid var(--border);flex-shrink:0}
.create-board-btn{display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border-radius:var(--r-sm);background:none;border:1px dashed var(--border);color:var(--muted);font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .15s}
.create-board-btn:hover{background:var(--col);color:var(--text);border-color:var(--accent)}
.create-board-form{display:none;flex-direction:column;gap:8px;margin-top:8px}
.create-board-form.show{display:flex}
.create-board-form input{background:var(--col);border:1px solid var(--accent);border-radius:var(--r-sm);padding:7px 10px;outline:none;color:var(--text);font-size:13px;font-family:inherit;width:100%}
.create-board-actions{display:flex;gap:6px}

/* ── TOOLBAR ── */
.toolbar{display:flex;align-items:center;gap:10px;padding:9px 20px;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.search{display:flex;align-items:center;gap:8px;background:var(--col);border:1px solid var(--border);border-radius:var(--r-sm);padding:5px 12px;width:200px;flex-shrink:0;transition:border-color .15s}
.search:focus-within{border-color:var(--accent)}
.search input{background:none;border:none;outline:none;color:var(--text);font-size:13px;font-family:inherit;width:100%}
.search input::placeholder{color:var(--muted)}
.filter-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:inherit;transition:all .15s;white-space:nowrap;flex-shrink:0}
.filter-chip:hover{background:var(--col);color:var(--text)}
.filter-chip.active{background:rgba(108,99,255,.15);color:#A78BFA;border-color:#A78BFA}
.toolbar-right{margin-left:auto;display:flex;gap:8px;flex-shrink:0}

/* ── BOARD ── */
.board{display:flex;gap:16px;padding:20px 20px 24px;overflow-x:auto;overflow-y:hidden;flex:1;align-items:flex-start;scrollbar-width:thin;scrollbar-color:var(--col) transparent}
.board::-webkit-scrollbar{height:6px}
.board::-webkit-scrollbar-thumb{background:var(--col);border-radius:3px}

/* ── COLUMN ── */
.col-wrap{flex-shrink:0;width:290px;display:flex;flex-direction:column;max-height:calc(100vh - 155px)}
.col-header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--col);border-radius:var(--r) var(--r) 0 0;border:1px solid var(--border);border-bottom:none;flex-shrink:0}
.col-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.col-title{font-size:13px;font-weight:600;flex:1;background:none;border:none;outline:none;color:var(--text);font-family:inherit;cursor:pointer;padding:2px 4px;border-radius:4px;border:1px solid transparent;transition:all .15s}
.col-title:hover{background:var(--card)}
.col-title:focus{background:var(--card);border-color:var(--accent);cursor:text}
.col-count{font-size:11px;font-weight:600;color:var(--muted);background:var(--card);border-radius:20px;padding:1px 7px;min-width:22px;text-align:center}
.col-menu{background:none;border:none;cursor:pointer;color:var(--muted);padding:2px;border-radius:4px;display:flex;align-items:center;transition:color .15s}
.col-menu:hover{color:var(--text);background:var(--card)}
.col-progress{height:3px;background:var(--border)}
.col-progress-fill{height:100%;transition:width .4s}
.col-body{background:var(--col);border:1px solid var(--border);border-top:none;border-radius:0 0 var(--r) var(--r);padding:8px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;flex:1;min-height:60px;scrollbar-width:thin;scrollbar-color:var(--card) transparent;transition:background .15s}
.col-body::-webkit-scrollbar{width:4px}
.col-body::-webkit-scrollbar-thumb{background:var(--card);border-radius:2px}
.col-body.drag-over{background:rgba(108,99,255,.06);border-color:rgba(108,99,255,.3)}

/* ── CARD ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;cursor:grab;transition:box-shadow .15s,border-color .15s;display:flex;flex-direction:column;gap:10px;position:relative;user-select:none}
.card:hover{border-color:rgba(108,99,255,.3);box-shadow:0 4px 16px rgba(0,0,0,.35)}
.card:active{cursor:grabbing}
.card.dragging{opacity:.4;transform:scale(.97)}
.card-top{display:flex;align-items:flex-start;gap:8px}
.card-title{font-size:13px;font-weight:500;line-height:1.45;color:var(--text);flex:1;word-break:break-word}
.card-menu-btn{background:none;border:none;cursor:pointer;color:var(--muted);padding:2px;border-radius:4px;display:flex;opacity:0;transition:opacity .15s,color .15s;flex-shrink:0}
.card:hover .card-menu-btn{opacity:1}
.card-menu-btn:hover{color:var(--text);background:var(--card-h)}
.card-tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;cursor:pointer;transition:filter .15s}
.tag:hover{filter:brightness(1.2)}
.card-desc{font-size:12px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-footer{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-meta{display:flex;align-items:center;gap:10px}
.card-meta-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.card-priority{width:7px;height:7px;border-radius:2px;flex-shrink:0}
.p-high{background:var(--red)}.p-medium{background:#FBBF24}.p-low{background:#34D399}
.add-card-btn{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:var(--r-sm);font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;border:none;background:transparent;width:100%;font-family:inherit;transition:all .15s;flex-shrink:0}
.add-card-btn:hover{background:var(--card);color:var(--text)}
.add-col-btn{flex-shrink:0;width:260px;height:44px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r);border:1px dashed var(--border);background:transparent;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s;align-self:flex-start}
.add-col-btn:hover{background:var(--col);color:var(--text);border-color:var(--accent)}

/* ── CTX MENU ── */
.ctx-menu{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:4px;z-index:1000;min-width:170px;box-shadow:0 8px 32px rgba(0,0,0,.5);display:none}
.ctx-menu.show{display:block}
.ctx-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:5px;font-size:13px;color:var(--text);cursor:pointer;border:none;background:none;font-family:inherit;width:100%;text-align:left;transition:background .1s}
.ctx-item:hover{background:var(--col)}
.ctx-item.danger{color:var(--red)}
.ctx-item.danger:hover{background:rgba(255,92,106,.1)}
.ctx-divider{height:1px;background:var(--border);margin:4px 0}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:900;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);width:540px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.7);display:flex;flex-direction:column;animation:modal-in .2s ease}
@keyframes modal-in{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;gap:12px;padding:18px 22px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.modal-head h2{font-size:15px;font-weight:600;flex:1;letter-spacing:-.2px}
.modal-close{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;border-radius:5px;display:flex;transition:color .15s}
.modal-close:hover{color:var(--text);background:var(--col)}
.modal-body{padding:18px 22px;display:flex;flex-direction:column;gap:16px;flex:1}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.form-input{background:var(--col);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 12px;color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color .15s;width:100%}
.form-input:focus{border-color:var(--accent)}
.form-textarea{resize:vertical;min-height:76px}
.priority-picker{display:flex;gap:8px}
.prio-btn{flex:1;padding:6px;border-radius:var(--r-sm);font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--col);color:var(--muted);font-family:inherit;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px}
.prio-btn.selected{color:#fff;border-color:transparent}
.prio-btn.p-high.selected{background:var(--red)}
.prio-btn.p-medium.selected{background:#FBBF24;color:#1a1100}
.prio-btn.p-low.selected{background:#34D399;color:#001a0e}
.modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0}
.tag-picker{display:flex;flex-wrap:wrap;gap:6px}
.tag-pick-btn{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid transparent;font-family:inherit;transition:all .15s;opacity:.5}
.tag-pick-btn.selected{opacity:1}

/* ── LABELS MODAL ── */
.labels-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:950;display:none;align-items:center;justify-content:center}
.labels-modal-overlay.show{display:flex}
.labels-modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);width:440px;max-width:95vw;box-shadow:0 24px 64px rgba(0,0,0,.7);display:flex;flex-direction:column;animation:modal-in .2s ease;max-height:90vh;overflow:hidden}
.labels-head{display:flex;align-items:center;padding:18px 22px 14px;border-bottom:1px solid var(--border);gap:10px;flex-shrink:0}
.labels-head h2{font-size:15px;font-weight:600;flex:1}
.labels-body{padding:16px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;flex:1}
.label-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);background:var(--col);border:1px solid var(--border);transition:border-color .15s}
.label-row:hover{border-color:rgba(255,255,255,.14)}
.label-color-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;cursor:pointer;border:2px solid rgba(255,255,255,.15);transition:transform .15s}
.label-color-dot:hover{transform:scale(1.2)}
.label-name-input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:13px;font-weight:500;font-family:inherit;border-bottom:1px solid transparent;transition:border-color .15s;padding:1px 0}
.label-name-input:focus{border-color:var(--accent)}
.label-preview{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;flex-shrink:0}
.label-del{background:none;border:none;cursor:pointer;color:var(--muted);padding:3px;border-radius:4px;display:flex;transition:color .15s,background .15s}
.label-del:hover{color:var(--red);background:rgba(255,92,106,.1)}
.labels-footer{padding:14px 16px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0}
.add-label-btn{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:var(--r-sm);font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border:1px dashed var(--border);background:transparent;width:100%;font-family:inherit;transition:all .15s}
.add-label-btn:hover{background:var(--col);color:var(--text);border-color:var(--accent)}

/* ── COLOR POPOVER ── */
.color-popover{position:fixed;z-index:1100;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:none;flex-wrap:wrap;gap:6px;width:168px}
.color-popover.show{display:flex}
.color-swatch{width:24px;height:24px;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:transform .12s,border-color .12s}
.color-swatch:hover{transform:scale(1.15)}
.color-swatch.selected{border-color:#fff}

/* ── SHARE / HISTORY ── */
.share-link-box{display:flex;gap:8px}
.share-link-box input{flex:1;background:var(--col);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 12px;color:var(--text);font-size:12px;font-family:'Inter',monospace;outline:none}
.share-link-box input:focus{border-color:var(--accent)}
.history-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:960;display:none;align-items:center;justify-content:center}
.history-modal-overlay.show{display:flex}
.history-modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);width:480px;max-width:95vw;max-height:85vh;box-shadow:0 24px 64px rgba(0,0,0,.7);display:flex;flex-direction:column;animation:modal-in .2s ease}
.history-body{padding:12px 16px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:2px}
.history-item{display:flex;align-items:flex-start;gap:10px;padding:8px 6px;border-radius:var(--r-sm);transition:background .1s}
.history-item:hover{background:var(--col)}
.history-icon{flex-shrink:0;margin-top:1px}
.history-content{flex:1;min-width:0}
.history-text{font-size:13px;line-height:1.4}
.history-meta{font-size:11px;color:var(--muted);margin-top:2px}
.history-initials-sm{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;flex-shrink:0;margin-top:1px}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 18px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:2000;transition:transform .25s ease;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- ══ AUTH GATE ══ -->
<div id="authGate">
  <div class="auth-logo">
    <svg width="24" height="24" viewBox="0 0 20 20" fill="none">
      <rect x="2" y="2" width="7" height="16" rx="2" fill="currentColor" opacity=".9"/>
      <rect x="11" y="2" width="7" height="10" rx="2" fill="currentColor" opacity=".5"/>
      <rect x="11" y="14" width="7" height="4" rx="2" fill="currentColor" opacity=".3"/>
    </svg>
    Kanban
  </div>
  <div class="auth-card">
    <h2>Entrar no quadro</h2>
    <p>Digite seu nome e a senha de acesso compartilhada.</p>
    <div class="form-group">
      <label class="form-label">Seu nome</label>
      <input class="auth-input" id="nameInput" type="text" placeholder="Ex: Ana" autocomplete="name" onkeydown="handlePasswordKey(event)">
    </div>
    <div class="form-group">
      <label class="form-label">Senha</label>
      <input class="auth-input" id="passwordInput" type="password" placeholder="Senha compartilhada" autocomplete="current-password" onkeydown="handlePasswordKey(event)">
    </div>
    <p class="auth-error" id="passwordError"></p>
    <button class="auth-btn" id="unlockBtn" onclick="tryUnlock()">Entrar</button>
  </div>
</div>

<!-- ══ APP ══ -->
<div class="app" id="appShell" style="display:none">
  <header class="header">
    <button class="header-logo-btn" id="logoBtn" onclick="toggleSidebar()">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
        <rect x="2" y="2" width="7" height="16" rx="2" fill="currentColor" opacity=".9"/>
        <rect x="11" y="2" width="7" height="10" rx="2" fill="currentColor" opacity=".5"/>
        <rect x="11" y="14" width="7" height="4" rx="2" fill="currentColor" opacity=".3"/>
      </svg>
      Board
      <svg class="chevron" width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M3 5l3.5 3.5L10 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="header-divider"></div>
    <input class="board-name-input" id="boardNameInput" value="" spellcheck="false" onchange="renameCurrent(this.value)">
    <div class="header-actions">
      <div class="presence-bar" id="presenceBar"></div>
      <span id="editingIndicator" class="editing-badge" style="display:none"></span>
      <span class="sync-dot" id="syncDot" title="Sincronizado"></span>
      <div class="header-divider"></div>
      <button class="btn btn-ghost btn-sm" onclick="openHistoryModal()">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.3"/><path d="M6.5 3.5v3l2 1.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        Histórico
      </button>
      <button class="btn btn-ghost btn-sm" onclick="openShareModal()">

<!--
══════════════════════════════════════════════════════════════
  GUIA DE CONFIGURAÇÃO — faça de uma vez, nesta ordem
══════════════════════════════════════════════════════════════

PASSO 1 — Criar projeto no Supabase
  1. Acesse https://supabase.com → "Start your project"
  2. New project → dê um nome, senha do banco, região São Paulo
  3. Aguarde ~2 min o projeto provisionar

PASSO 2 — Criar as tabelas
  Menu lateral → SQL Editor → New query → cole e execute:

  ──────────────────────────────────────────────────────────
  create extension if not exists "pgcrypto";

  create table boards (
    id         uuid primary key default gen_random_uuid(),
    name       text not null,
    created_at timestamptz default now()
  );
  create table board_cols (
    id         uuid primary key default gen_random_uuid(),
    board_id   uuid references boards(id) on delete cascade,
    title      text not null,
    color      text default '#7B82A0',
    position   int  default 0
  );
  create table cards (
    id         uuid primary key default gen_random_uuid(),
    board_id   uuid references boards(id) on delete cascade,
    col_id     uuid references board_cols(id) on delete cascade,
    title      text not null,
    description text,
    priority   text default 'medium',
    due_date   date,
    position   int  default 0,
    created_at timestamptz default now()
  );
  create table labels (
    id          uuid primary key default gen_random_uuid(),
    board_id    uuid references boards(id) on delete cascade,
    name        text not null,
    color_bg    text default '#1E1A40',
    color_text  text default '#A78BFA',
    color_dot   text default '#A78BFA'
  );
  create table card_labels (
    card_id   uuid references cards(id) on delete cascade,
    label_id  uuid references labels(id) on delete cascade,
    board_id  uuid references boards(id) on delete cascade,
    primary key (card_id, label_id)
  );
  create table history (
    id         uuid primary key default gen_random_uuid(),
    board_id   uuid references boards(id) on delete cascade,
    user_name  text,
    action     text,
    detail     text,
    created_at timestamptz default now()
  );
  ──────────────────────────────────────────────────────────

PASSO 3 — Habilitar Realtime
  Menu lateral → Database → Replication
  Ative o toggle "Realtime" para cada uma das tabelas:
  boards, board_cols, cards, labels, card_labels, history

PASSO 4 — Configurar RLS (acesso sem login de usuário)
  SQL Editor → New query → cole e execute:

  ──────────────────────────────────────────────────────────
  alter table boards      enable row level security;
  alter table board_cols  enable row level security;
  alter table cards       enable row level security;
  alter table labels      enable row level security;
  alter table card_labels enable row level security;
  alter table history     enable row level security;

  -- Permite tudo para usuários anônimos autenticados
  -- (a senha do app é validada no frontend antes de chamar signInAnonymously)
  create policy "anon_all" on boards      for all to anon, authenticated using (true) with check (true);
  create policy "anon_all" on board_cols  for all to anon, authenticated using (true) with check (true);
  create policy "anon_all" on cards       for all to anon, authenticated using (true) with check (true);
  create policy "anon_all" on labels      for all to anon, authenticated using (true) with check (true);
  create policy "anon_all" on card_labels for all to anon, authenticated using (true) with check (true);
  create policy "anon_all" on history     for all to anon, authenticated using (true) with check (true);
  ──────────────────────────────────────────────────────────

PASSO 5 — Habilitar Auth Anônimo no Supabase
  Menu lateral → Authentication → Providers
  Role até "Anonymous Sign-ins" → ative o toggle → Save

PASSO 6 — Copiar credenciais para o index.html
  Menu lateral → Settings → API
  Copie:
    Project URL  → cole em SUPABASE_URL     (linha ~10 do <script>)
    anon/public  → cole em SUPABASE_ANON_KEY

  Defina também APP_PASSWORD com a senha que as duas pessoas
  vão usar para entrar. Ex: APP_PASSWORD = 'kanban2024'
  (essa senha fica visível no HTML — use algo que não seja
   reutilizado em outros serviços)

PASSO 7 — Publicar no GitHub Pages
  1. Salve o arquivo como index.html
  2. Crie um repositório no GitHub (pode ser privado)
  3. Faça upload do index.html
  4. Settings → Pages → Source: Deploy from branch
     Branch: main  /  Folder: / (root)  → Save
  5. Aguarde ~1 min → acesse a URL gerada

  IMPORTANTE: se o repositório for público, qualquer pessoa
  pode ver a senha no código-fonte. Use um repositório PRIVADO
  no GitHub para proteger a APP_PASSWORD.

══════════════════════════════════════════════════════════════
-->
</body>
</html>
