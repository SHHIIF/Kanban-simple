<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanban</title>

<!-- Supabase JS via ESM CDN -->
<script type="module">
/* ═══════════════════════════════════════════════════════════════
   SUPABASE CONFIG
   Substitua os dois valores abaixo pelos do seu projeto.
   Veja o guia completo no final deste arquivo.
════════════════════════════════════════════════════════════════ */
const SUPABASE_URL    = 'COLE_SEU_PROJECT_URL';      // ex: https://xxxx.supabase.co
const SUPABASE_ANON_KEY = 'COLE_SUA_ANON_KEY';

import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  realtime: { params: { eventsPerSecond: 20 } }
});

/* ═══════════════════════════════════════════
   CONSTANTS
══════════════════════════════════════════════ */
const PALETTE = [
  '#60A5FA','#818CF8','#A78BFA','#F472B6','#FB7185',
  '#FBBF24','#34D399','#2DD4BF','#F97316','#E879F9',
  '#94A3B8','#C084FC'
];

/* ═══════════════════════════════════════════
   LOCAL STATE (cache da UI)
   Fonte de verdade = Supabase.
   Toda mutação → escreve no DB → listener recebe → re-render.
══════════════════════════════════════════════ */
let currentUser   = null;
let boards        = [];          // [{ id, name, owner_id }]
let currentBoard  = null;        // { id, name, ... }
let cols          = [];          // [{ id, board_id, title, color, position }]
let cards         = [];          // [{ id, col_id, title, desc, priority, due_date, position }]
let cardLabels    = {};          // { card_id: [label_id] }
let labels        = [];          // [{ id, board_id, name, color_bg, color_text, color_dot }]
let onlineUsers   = {};          // { user_id: { name, photo, last_seen } }
let historyItems  = [];          // últimos 60 eventos
let editingUsers  = {};          // { user_id: { name, board_id } }

// UI
let dragCardId      = null;
let ctxCardId       = null;
let ctxColId        = null;
let editingCardId   = null;
let activeFilters   = new Set();
let selectedPriority = 'medium';
let selectedTags    = [];
let modalColId      = null;
let colorTargetId   = null;
let realtimeChannel = null;
let presenceInterval = null;

/* ═══════════════════════════════════════════
   UTILS
══════════════════════════════════════════════ */
function uid()      { return crypto.randomUUID(); }
function esc(s)     { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(s) { const d=new Date(s+'T00:00:00'); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}); }
function hexAlpha(h,a){ const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16); return `rgba(${r},${g},${b},${a})`; }
function initials(n){ return (n||'??').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); }
function userColor(id){ const c=['#6C63FF','#34D399','#FBBF24','#FB7185','#60A5FA','#A78BFA']; let h=0; for(let ch of(id||'')) h=(h+ch.charCodeAt(0))%c.length; return c[h]; }
function relTime(iso){ const s=Math.floor((Date.now()-new Date(iso))/1000); if(s<60)return 'agora mesmo'; if(s<3600)return Math.floor(s/60)+'m atrás'; if(s<86400)return Math.floor(s/3600)+'h atrás'; return Math.floor(s/86400)+'d atrás'; }

/* ── Sync dot ── */
function setSyncing(){ const d=document.getElementById('syncDot'); if(d){d.className='sync-dot syncing';d.title='Salvando…';} }
function setSynced(){  const d=document.getElementById('syncDot'); if(d){d.className='sync-dot';d.title='Sincronizado';} }
function setSyncErr(){ const d=document.getElementById('syncDot'); if(d){d.className='sync-dot error';d.title='Erro de conexão';} }

/* ── Toast ── */
function toast(msg,isErr=false){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.borderColor=isErr?'var(--red)':'var(--border)';
  t.classList.add('show');
  clearTimeout(t._t);
  t._t=setTimeout(()=>t.classList.remove('show'),2400);
}

/* ═══════════════════════════════════════════
   AUTH
══════════════════════════════════════════════ */
async function signInGoogle(){
  document.getElementById('authLoading').classList.remove('hidden');
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.href }
  });
  if(error){ document.getElementById('authLoading').classList.add('hidden'); toast(error.message, true); }
}

async function signOut(){
  await stopPresence();
  await sb.auth.signOut();
}

sb.auth.onAuthStateChange(async (event, session) => {
  if(session?.user){
    currentUser = {
      id:    session.user.id,
      name:  session.user.user_metadata?.full_name || session.user.email,
      photo: session.user.user_metadata?.avatar_url || null,
      email: session.user.email
    };
    document.getElementById('authGate').classList.add('hidden');
    document.getElementById('appShell').style.display='flex';
    renderUserAvatar();
    await initBoards();
  } else {
    currentUser = null;
    document.getElementById('authGate').classList.remove('hidden');
    document.getElementById('appShell').style.display='none';
  }
});

function renderUserAvatar(){
  const btn=document.getElementById('userAvatarBtn');
  if(!btn) return;
  btn.innerHTML = currentUser?.photo
    ? `<img src="${esc(currentUser.photo)}" class="presence-avatar" title="${esc(currentUser.name)}" style="border:none">`
    : `<div class="presence-avatar-initials" style="background:${userColor(currentUser?.id||'')}" title="${esc(currentUser?.name||'')}">${initials(currentUser?.name)}</div>`;
}

function openUserMenu(e){
  e.stopPropagation();
  const menu=document.getElementById('ctxMenu');
  menu.innerHTML=`
    <div style="padding:8px 10px 6px;font-size:12px;color:var(--muted)">${esc(currentUser?.name||'')}
      <br><span style="font-size:11px">${esc(currentUser?.email||'')}</span></div>
    <div class="ctx-divider"></div>
    <button class="ctx-item danger" onclick="signOut()">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M5 2H2.5A1.5 1.5 0 0 0 1 3.5v6A1.5 1.5 0 0 0 2.5 11H5M8.5 9.5 12 6.5 8.5 3.5M12 6.5H5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Sair
    </button>`;
  positionMenu(e);
}

/* ═══════════════════════════════════════════
   INIT BOARDS
══════════════════════════════════════════════ */
async function initBoards(){
  const params = new URLSearchParams(window.location.search);
  const sharedId = params.get('board');

  const { data, error } = await sb.from('boards').select('*').order('created_at');
  if(error){ toast('Erro ao carregar quadros', true); setSyncErr(); return; }

  boards = data || [];

  if(!boards.length){
    // Primeiro uso: cria board padrão
    await createDefaultBoard();
    return;
  }

  const target = sharedId && boards.find(b=>b.id===sharedId)
    ? sharedId : boards[0].id;
  await switchBoard(target);
}

async function createDefaultBoard(){
  const { data: board, error } = await sb
    .from('boards')
    .insert({ name: 'Sprint Q3 — Produto', owner_id: currentUser.id })
    .select().single();
  if(error){ toast('Erro ao criar quadro', true); return; }

  // Colunas padrão
  await sb.from('board_cols').insert([
    { board_id: board.id, title:'Backlog',      color:'#7B82A0', position: 0 },
    { board_id: board.id, title:'Em progresso', color:'#6C63FF', position: 1 },
    { board_id: board.id, title:'Revisão',      color:'#FBBF24', position: 2 },
    { board_id: board.id, title:'Concluído',    color:'#34D399', position: 3 },
  ]);

  // Labels padrão
  await sb.from('labels').insert([
    { board_id: board.id, name:'Design',   color_bg:'#1E3A5F', color_text:'#60A5FA', color_dot:'#60A5FA' },
    { board_id: board.id, name:'Backend',  color_bg:'#3D2A0A', color_text:'#FBBF24', color_dot:'#FBBF24' },
    { board_id: board.id, name:'Entregue', color_bg:'#0D2B1E', color_text:'#34D399', color_dot:'#34D399' },
    { board_id: board.id, name:'Bug',      color_bg:'#2D0E1A', color_text:'#FB7185', color_dot:'#FB7185' },
    { board_id: board.id, name:'Feature',  color_bg:'#1E1A40', color_text:'#A78BFA', color_dot:'#A78BFA' },
  ]);

  boards = [board];
  await switchBoard(board.id);
}

/* ═══════════════════════════════════════════
   SWITCH BOARD + DATA LOAD
══════════════════════════════════════════════ */
async function switchBoard(id){
  // Detach previous realtime channel
  if(realtimeChannel){ await sb.removeChannel(realtimeChannel); realtimeChannel=null; }
  await stopPresence();

  currentBoard = boards.find(b=>b.id===id) || null;
  if(!currentBoard) return;

  document.getElementById('boardNameInput').value = currentBoard.name;
  renderBoardList();
  closeSidebar();
  setSyncing();

  // Load all data in parallel
  const [colsRes, cardsRes, labelsRes, clRes, histRes] = await Promise.all([
    sb.from('board_cols').select('*').eq('board_id', id).order('position'),
    sb.from('cards').select('*').eq('board_id', id).order('position'),
    sb.from('labels').select('*').eq('board_id', id),
    sb.from('card_labels').select('*').eq('board_id', id),
    sb.from('history').select('*').eq('board_id', id).order('created_at', {ascending:false}).limit(60),
  ]);

  cols        = colsRes.data  || [];
  cards       = cardsRes.data || [];
  labels      = labelsRes.data|| [];
  historyItems= histRes.data  || [];
  cardLabels  = {};
  (clRes.data||[]).forEach(cl=>{ if(!cardLabels[cl.card_id]) cardLabels[cl.card_id]=[]; cardLabels[cl.card_id].push(cl.label_id); });

  setSynced();
  render();
  renderBoardList();
  subscribeRealtime(id);
  startPresence(id);
}

/* ═══════════════════════════════════════════
   REALTIME — Supabase postgres_changes
══════════════════════════════════════════════ */
function subscribeRealtime(boardId){
  realtimeChannel = sb.channel(`board:${boardId}`)
    /* cards */
    .on('postgres_changes',{ event:'INSERT', schema:'public', table:'cards', filter:`board_id=eq.${boardId}` }, p => {
      if(!cards.find(c=>c.id===p.new.id)) cards.push(p.new);
      render();
    })
    .on('postgres_changes',{ event:'UPDATE', schema:'public', table:'cards', filter:`board_id=eq.${boardId}` }, p => {
      const i=cards.findIndex(c=>c.id===p.new.id);
      if(i>=0) cards[i]=p.new; else cards.push(p.new);
      render();
    })
    .on('postgres_changes',{ event:'DELETE', schema:'public', table:'cards', filter:`board_id=eq.${boardId}` }, p => {
      cards=cards.filter(c=>c.id!==p.old.id);
      render();
    })
    /* cols */
    .on('postgres_changes',{ event:'INSERT', schema:'public', table:'board_cols', filter:`board_id=eq.${boardId}` }, p => {
      if(!cols.find(c=>c.id===p.new.id)) cols.push(p.new);
      cols.sort((a,b)=>a.position-b.position);
      render();
    })
    .on('postgres_changes',{ event:'UPDATE', schema:'public', table:'board_cols', filter:`board_id=eq.${boardId}` }, p => {
      const i=cols.findIndex(c=>c.id===p.new.id);
      if(i>=0) cols[i]=p.new; else cols.push(p.new);
      cols.sort((a,b)=>a.position-b.position);
      render();
    })
    .on('postgres_changes',{ event:'DELETE', schema:'public', table:'board_cols', filter:`board_id=eq.${boardId}` }, p => {
      cols=cols.filter(c=>c.id!==p.old.id);
      render();
    })
    /* labels */
    .on('postgres_changes',{ event:'*', schema:'public', table:'labels', filter:`board_id=eq.${boardId}` }, async () => {
      const { data } = await sb.from('labels').select('*').eq('board_id', boardId);
      labels = data || [];
      render();
    })
    /* card_labels */
    .on('postgres_changes',{ event:'*', schema:'public', table:'card_labels', filter:`board_id=eq.${boardId}` }, async () => {
      const { data } = await sb.from('card_labels').select('*').eq('board_id', boardId);
      cardLabels = {};
      (data||[]).forEach(cl=>{ if(!cardLabels[cl.card_id]) cardLabels[cl.card_id]=[]; cardLabels[cl.card_id].push(cl.label_id); });
      render();
    })
    /* history */
    .on('postgres_changes',{ event:'INSERT', schema:'public', table:'history', filter:`board_id=eq.${boardId}` }, p => {
      historyItems.unshift(p.new);
      if(historyItems.length>60) historyItems.pop();
    })
    /* board name */
    .on('postgres_changes',{ event:'UPDATE', schema:'public', table:'boards', filter:`id=eq.${boardId}` }, p => {
      currentBoard={ ...currentBoard, ...p.new };
      document.getElementById('boardNameInput').value = p.new.name;
    })
    /* presence via Broadcast */
    .on('broadcast', { event:'presence' }, ({ payload }) => {
      if(payload.user_id !== currentUser?.id){
        onlineUsers[payload.user_id] = payload;
        renderPresenceBar();
      }
    })
    .on('broadcast', { event:'editing' }, ({ payload }) => {
      if(payload.user_id !== currentUser?.id){
        editingUsers[payload.user_id] = payload;
        renderEditingIndicator();
        clearTimeout(editingUsers[payload.user_id]._t);
        editingUsers[payload.user_id]._t = setTimeout(()=>{ delete editingUsers[payload.user_id]; renderEditingIndicator(); }, 5000);
      }
    })
    .on('broadcast', { event:'offline' }, ({ payload }) => {
      delete onlineUsers[payload.user_id];
      renderPresenceBar();
    })
    .subscribe();
}

/* ═══════════════════════════════════════════
   PRESENCE
══════════════════════════════════════════════ */
function startPresence(boardId){
  if(!currentUser || !realtimeChannel) return;
  const broadcast = () => realtimeChannel.send({
    type:'broadcast', event:'presence',
    payload:{ user_id: currentUser.id, name: currentUser.name, photo: currentUser.photo, board_id: boardId, ts: Date.now() }
  });
  broadcast();
  presenceInterval = setInterval(broadcast, 20000);
}

async function stopPresence(){
  clearInterval(presenceInterval);
  presenceInterval=null;
  if(realtimeChannel && currentUser){
    await realtimeChannel.send({ type:'broadcast', event:'offline', payload:{ user_id: currentUser.id } });
  }
  onlineUsers={};
  renderPresenceBar();
}

function signalEditing(){
  if(!currentUser || !realtimeChannel || !currentBoard) return;
  realtimeChannel.send({ type:'broadcast', event:'editing', payload:{ user_id: currentUser.id, name: currentUser.name, board_id: currentBoard.id } });
}

function renderPresenceBar(){
  const bar=document.getElementById('presenceBar');
  if(!bar) return;
  bar.innerHTML = Object.values(onlineUsers).slice(0,5).map(u =>
    u.photo
      ? `<img src="${esc(u.photo)}" class="presence-avatar" title="${esc(u.name||'')} • online">`
      : `<div class="presence-avatar-initials" style="background:${userColor(u.user_id||'')}" title="${esc(u.name||'')} • online">${initials(u.name)}</div>`
  ).join('');
}

function renderEditingIndicator(){
  const el=document.getElementById('editingIndicator');
  if(!el) return;
  const others=Object.values(editingUsers).filter(u=>u.board_id===currentBoard?.id);
  if(others.length){ el.style.display=''; el.textContent=others.map(u=>(u.name||'').split(' ')[0]).join(', ')+' editando…'; }
  else { el.style.display='none'; }
}

/* ═══════════════════════════════════════════
   LOG HISTORY
══════════════════════════════════════════════ */
async function logHistory(action, detail){
  if(!currentUser || !currentBoard) return;
  await sb.from('history').insert({
    board_id:   currentBoard.id,
    user_id:    currentUser.id,
    user_name:  currentUser.name,
    user_photo: currentUser.photo||null,
    action,
    detail
  });
}

/* ═══════════════════════════════════════════
   RENDER
══════════════════════════════════════════════ */
function render(){
  const bd=document.getElementById('board');
  if(!bd) return;
  bd.innerHTML='';
  const q=(document.getElementById('searchInput')?.value||'').toLowerCase();

  cols.forEach(col=>{
    const colCards=cards.filter(c=>{
      if(c.col_id!==col.id) return false;
      if(activeFilters.size && !activeFilters.has(c.priority)) return false;
      if(q && !(c.title||'').toLowerCase().includes(q) && !(c.desc||'').toLowerCase().includes(q)) return false;
      return true;
    });
    const total=cards.filter(c=>c.col_id===col.id).length;
    const isLast=cols[cols.length-1]?.id===col.id;
    const pct=isLast&&total?100:0;

    const wrap=document.createElement('div');
    wrap.className='col-wrap';
    wrap.dataset.colId=col.id;
    wrap.innerHTML=`
      <div class="col-header">
        <span class="col-dot" style="background:${col.color}"></span>
        <input class="col-title" value="${esc(col.title)}" onchange="renameCol('${col.id}',this.value)" spellcheck="false">
        <span class="col-count">${total}</span>
        <button class="col-menu" onclick="colMenu(event,'${col.id}')">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="3" r="1.2" fill="currentColor"/><circle cx="7" cy="7" r="1.2" fill="currentColor"/><circle cx="7" cy="11" r="1.2" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="col-progress"><div class="col-progress-fill" style="width:${pct}%;background:${col.color}"></div></div>
      <div class="col-body" id="body-${col.id}"
        ondragover="onDragOver(event,'${col.id}')"
        ondrop="onDrop(event,'${col.id}')"
        ondragleave="onDragLeave(event)">
        ${colCards.map(c=>cardHTML(c)).join('')}
        <button class="add-card-btn" onclick="openAddCardInCol('${col.id}')">
          <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M5.5 1v9M1 5.5h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          Adicionar card
        </button>
      </div>`;
    bd.appendChild(wrap);
  });

  const addBtn=document.createElement('button');
  addBtn.className='add-col-btn';
  addBtn.innerHTML=`<svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 1v10M1 6.5h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg> Nova coluna`;
  addBtn.onclick=openAddCol;
  bd.appendChild(addBtn);
  attachDrag();
}

function cardHTML(c){
  const tagIds = cardLabels[c.id]||[];
  const tagsHtml = tagIds.map(tid=>{ const l=labels.find(x=>x.id===tid); if(!l)return ''; return `<span class="tag" style="background:${l.color_bg};color:${l.color_text}">${esc(l.name)}</span>`; }).join('');
  const dateStr = c.due_date ? fmtDate(c.due_date) : '';
  const overdue = c.due_date && new Date(c.due_date)<new Date() && cols[cols.length-1]?.id!==c.col_id;
  return `
    <div class="card" id="card-${c.id}" draggable="true" data-card-id="${c.id}"
      ondblclick="openEditCard('${c.id}')" oncontextmenu="showCtxMenu(event,'${c.id}')">
      <div class="card-top">
        <span class="card-priority p-${c.priority||'medium'}"></span>
        <span class="card-title">${esc(c.title)}</span>
        <button class="card-menu-btn" onclick="showCtxMenu(event,'${c.id}')">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><circle cx="6.5" cy="2.5" r="1.1" fill="currentColor"/><circle cx="6.5" cy="6.5" r="1.1" fill="currentColor"/><circle cx="6.5" cy="10.5" r="1.1" fill="currentColor"/></svg>
        </button>
      </div>
      ${c.desc?`<div class="card-desc">${esc(c.desc)}</div>`:''}
      ${tagsHtml?`<div class="card-tags">${tagsHtml}</div>`:''}
      <div class="card-footer">
        <div class="card-meta">
          ${dateStr?`<span class="card-meta-item" style="${overdue?'color:var(--red)':''}">
            <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><rect x="1" y="2" width="9" height="8" rx="1" stroke="currentColor" stroke-width="1.2"/><path d="M1 4.5h9M3.5 1v2M7.5 1v2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
            ${dateStr}</span>`:''}
        </div>
      </div>
    </div>`;
}

/* ═══════════════════════════════════════════
   DRAG & DROP
══════════════════════════════════════════════ */
function attachDrag(){
  document.querySelectorAll('.card[draggable]').forEach(el=>{
    el.addEventListener('dragstart',()=>{ dragCardId=el.dataset.cardId; setTimeout(()=>el.classList.add('dragging'),0); });
    el.addEventListener('dragend',()=>{ el.classList.remove('dragging'); document.querySelectorAll('.col-body').forEach(b=>b.classList.remove('drag-over')); dragCardId=null; });
  });
}
function onDragOver(e,colId){ e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function onDragLeave(e){ e.currentTarget.classList.remove('drag-over'); }
async function onDrop(e,colId){
  e.preventDefault(); e.currentTarget.classList.remove('drag-over');
  if(!dragCardId) return;
  const card=cards.find(c=>c.id===dragCardId);
  if(!card||card.col_id===colId) return;
  setSyncing(); signalEditing();
  const { error }=await sb.from('cards').update({ col_id: colId }).eq('id', dragCardId);
  if(error){ toast('Erro ao mover card', true); setSyncErr(); return; }
  setSynced();
  logHistory('card_move', `Card "${card.title}" movido`);
}

/* ═══════════════════════════════════════════
   BOARD SIDEBAR
══════════════════════════════════════════════ */
function toggleSidebar(){
  const sb2=document.getElementById('boardSidebar'),ov=document.getElementById('sidebarOverlay'),btn=document.getElementById('logoBtn');
  const open=sb2.classList.toggle('open');
  ov.classList.toggle('show',open);
  btn.classList.toggle('open',open);
  if(open){ renderBoardList(); setTimeout(()=>document.getElementById('boardSearchInput')?.focus(),220); }
}
function closeSidebar(){
  document.getElementById('boardSidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
  document.getElementById('logoBtn').classList.remove('open');
}

function renderBoardList(q=''){
  const list=document.getElementById('boardList');
  if(!list) return;
  const filtered=q?boards.filter(b=>(b.name||'').toLowerCase().includes(q.toLowerCase())):boards;
  list.innerHTML=filtered.map(b=>`
    <div class="board-item ${b.id===currentBoard?.id?'active':''}">
      <span class="board-item-icon" onclick="switchBoard('${b.id}')" style="cursor:pointer">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <rect x="1" y="1" width="5" height="12" rx="1.5" fill="currentColor" opacity=".8"/>

function filterBoards(q){ renderBoardList(q); }
function showCreateForm(){ document.getElementById('createBoardForm').classList.add('show'); setTimeout(()=>document.getElementById('newBoardInput')?.focus(),50); }
function hideCreateForm(){ document.getElementById('createBoardForm').classList.remove('show'); document.getElementById('newBoardInput').value=''; }
function createBoardKey(e){ if(e.key==='Enter') createBoard(); if(e.key==='Escape') hideCreateForm(); }

async function createBoard(){
  const name=document.getElementById('newBoardInput').value.trim();
  if(!name) return;
  setSyncing();
  const { data: board, error }=await sb.from('boards').insert({ name, owner_id: currentUser.id }).select().single();
  if(error){ toast('Erro ao criar quadro', true); setSyncErr(); return; }

  await sb.from('board_cols').insert([
    { board_id: board.id, title:'A fazer',      color:'#7B82A0', position:0 },
    { board_id: board.id, title:'Em progresso', color:'#6C63FF', position:1 },
    { board_id: board.id, title:'Concluído',    color:'#34D399', position:2 },
  ]);
  await sb.from('labels').insert([
    { board_id: board.id, name:'Design',   color_bg:'#1E3A5F', color_text:'#60A5FA', color_dot:'#60A5FA' },
    { board_id: board.id, name:'Backend',  color_bg:'#3D2A0A', color_text:'#FBBF24', color_dot:'#FBBF24' },
    { board_id: board.id, name:'Feature',  color_bg:'#1E1A40', color_text:'#A78BFA', color_dot:'#A78BFA' },
  ]);

  boards.push(board);
  hideCreateForm();
  await switchBoard(board.id);
  logHistory('board_create', `Quadro "${name}" criado`);
  toast(`Quadro "${name}" criado`);
  setSynced();
}

async function deleteBoard(id){
  if(boards.length===1){ toast('Não é possível excluir o único quadro'); return; }
  const b=boards.find(x=>x.id===id);
  if(!confirm(`Excluir "${b?.name}"? Essa ação não pode ser desfeita.`)) return;
  setSyncing();
  // CASCADE via RLS/FK apaga cols, cards, labels, history
  const { error }=await sb.from('boards').delete().eq('id', id);
  if(error){ toast('Erro ao excluir quadro', true); setSyncErr(); return; }
  boards=boards.filter(x=>x.id!==id);
  if(currentBoard?.id===id) await switchBoard(boards[0].id);
  else renderBoardList();
  toast('Quadro excluído'); setSynced();
}

async function renameCurrent(val){
  if(!val.trim()||!currentBoard) return;
  setSyncing(); signalEditing();
  const { error }=await sb.from('boards').update({ name: val.trim() }).eq('id', currentBoard.id);
  if(error){ toast('Erro ao renomear', true); setSyncErr(); return; }
  currentBoard.name=val.trim();
  boards=boards.map(b=>b.id===currentBoard.id?{...b,name:val.trim()}:b);
  logHistory('board_rename', `Quadro renomeado para "${val.trim()}"`);
  setSynced();
}

function showCtxMenu(e,cardId){
  e.preventDefault(); e.stopPropagation();
  ctxCardId=cardId; ctxColId=null;
  const menu=document.getElementById('ctxMenu');
  menu.innerHTML=`
    <button class="ctx-item" onclick="ctxEdit()"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M8.5 1.5 11.5 4.5l-7 7H2v-3l7-7z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>Editar</button>
    <button class="ctx-item" onclick="ctxDuplicate()"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="4" y="4" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M2 9V3.5A1.5 1.5 0 0 1 3.5 2H9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>Duplicar</button>
    <div class="ctx-divider"></div>
    <button class="ctx-item danger" onclick="ctxDelete()"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M1.5 3.5h10M4.5 3.5V2.5h4v1M5 6v4M8 6v4M2.5 3.5l.8 7.2a1 1 0 0 0 1 .8h4.4a1 1 0 0 0 1-.8l.8-7.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>Excluir</button>`;
  positionMenu(e);
}
function positionMenu(e){ const m=document.getElementById('ctxMenu'); m.classList.add('show'); m.style.left=Math.min(e.clientX,window.innerWidth-190)+'px'; m.style.top=Math.min(e.clientY,window.innerHeight-160)+'px'; }
function hideCtxMenu(){ document.getElementById('ctxMenu').classList.remove('show'); }
function ctxEdit(){ hideCtxMenu(); openEditCard(ctxCardId); }

async function ctxDuplicate(){
  hideCtxMenu();
  const card=cards.find(c=>c.id===ctxCardId);
  if(!card) return;
  setSyncing(); signalEditing();
  const { data: newCard, error }=await sb.from('cards').insert({ board_id: currentBoard.id, col_id: card.col_id, title: card.title+' (cópia)', desc: card.desc||null, priority: card.priority, due_date: card.due_date||null, position: card.position, created_by: currentUser.id }).select().single();
  if(error){ toast('Erro ao duplicar', true); setSyncErr(); return; }
  // Duplicate labels
  const srcLabels=cardLabels[card.id]||[];
  if(srcLabels.length && newCard){
    await sb.from('card_labels').insert(srcLabels.map(lid=>({ card_id: newCard.id, label_id: lid, board_id: currentBoard.id })));
  }
  logHistory('card_duplicate', `Card "${card.title}" duplicado`); toast('Card duplicado'); setSynced();
}

async function ctxDelete(){
  hideCtxMenu();
  const card=cards.find(c=>c.id===ctxCardId);
  setSyncing(); signalEditing();
  const { error }=await sb.from('cards').delete().eq('id', ctxCardId);
  if(error){ toast('Erro ao excluir', true); setSyncErr(); return; }
  logHistory('card_delete', `Card "${card?.title}" excluído`); toast('Card excluído'); setSynced();
}

/* ═══════════════════════════════════════════
   CARD MODAL
══════════════════════════════════════════════ */
function populateModal(card=null){
  const sel=document.getElementById('mCol');
  sel.innerHTML=cols.map(c=>`<option value="${c.id}" ${card?.col_id===c.id?'selected':''}>${esc(c.title)}</option>`).join('');
  if(modalColId&&!card) sel.value=modalColId;

  const tp=document.getElementById('tagPicker');
  tp.innerHTML=labels.map(l=>`
    <button class="tag-pick-btn ${selectedTags.includes(l.id)?'selected':''}"
      style="background:${l.color_bg};color:${l.color_text};border-color:${selectedTags.includes(l.id)?l.color_text:'transparent'}"
      data-tag="${l.id}" onclick="toggleTag(this,'${l.id}','${l.color_text}')">${esc(l.name)}</button>`).join('');

  document.querySelectorAll('.prio-btn').forEach(b=>b.classList.toggle('selected',b.dataset.p===selectedPriority));
  document.getElementById('mTitle').value = card?.title||'';
  document.getElementById('mDesc').value  = card?.desc||'';
  document.getElementById('mDate').value  = card?.due_date||'';
}

function openNewCard(){ editingCardId=null; modalColId=cols[0]?.id||null; selectedPriority='medium'; selectedTags=[]; document.getElementById('modalTitle').textContent='Novo card'; populateModal(); document.getElementById('modalOverlay').classList.add('show'); setTimeout(()=>document.getElementById('mTitle').focus(),80); }
function openAddCardInCol(colId){ editingCardId=null; modalColId=colId; selectedPriority='medium'; selectedTags=[]; document.getElementById('modalTitle').textContent='Novo card'; populateModal(); document.getElementById('modalOverlay').classList.add('show'); setTimeout(()=>document.getElementById('mTitle').focus(),80); }
function openEditCard(cardId){
  const card=cards.find(c=>c.id===cardId);
  if(!card) return;
  editingCardId=cardId; modalColId=card.col_id;
  selectedPriority=card.priority||'medium'; selectedTags=[...(cardLabels[cardId]||[])];
  document.getElementById('modalTitle').textContent='Editar card';
  populateModal(card);
  document.getElementById('modalOverlay').classList.add('show');
  setTimeout(()=>document.getElementById('mTitle').focus(),80);
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('show'); editingCardId=null; }
function selectPriority(btn){ selectedPriority=btn.dataset.p; document.querySelectorAll('.prio-btn').forEach(b=>b.classList.toggle('selected',b===btn)); }
function toggleTag(btn,id,text){ if(selectedTags.includes(id)){selectedTags=selectedTags.filter(t=>t!==id);btn.classList.remove('selected');btn.style.borderColor='transparent';}else{selectedTags.push(id);btn.classList.add('selected');btn.style.borderColor=text;} }

async function saveCard(){
  const title=document.getElementById('mTitle').value.trim();
  if(!title){ document.getElementById('mTitle').focus(); return; }
  const colId=document.getElementById('mCol').value;
  const desc=document.getElementById('mDesc').value.trim()||null;
  const date=document.getElementById('mDate').value||null;
  setSyncing(); signalEditing();

  if(editingCardId){
    const { error }=await sb.from('cards').update({ title, desc, col_id: colId, priority: selectedPriority, due_date: date }).eq('id', editingCardId);
    if(error){ toast('Erro ao salvar', true); setSyncErr(); return; }
    // Update labels: delete old, insert new
    await sb.from('card_labels').delete().eq('card_id', editingCardId);
    if(selectedTags.length) await sb.from('card_labels').insert(selectedTags.map(lid=>({ card_id: editingCardId, label_id: lid, board_id: currentBoard.id })));
    logHistory('card_edit', `Card "${title}" editado`); toast('Card atualizado');
  } else {
    const maxPos=Math.max(-1,...cards.filter(c=>c.col_id===colId).map(c=>c.position));
    const { data: newCard, error }=await sb.from('cards').insert({ board_id: currentBoard.id, col_id: colId, title, desc, priority: selectedPriority, due_date: date, position: maxPos+1, created_by: currentUser.id }).select().single();
    if(error){ toast('Erro ao criar card', true); setSyncErr(); return; }
    if(selectedTags.length && newCard) await sb.from('card_labels').insert(selectedTags.map(lid=>({ card_id: newCard.id, label_id: lid, board_id: currentBoard.id })));
    logHistory('card_create', `Card "${title}" criado`); toast('Card criado');
  }
  setSynced(); closeModal();
}

function openLabelsModal(){ renderLabelsBody(); document.getElementById('labelsOverlay').classList.add('show'); }
function closeLabelsModal(){ document.getElementById('labelsOverlay').classList.remove('show'); hideColorPopover(); }

function renderLabelsBody(){
  const body=document.getElementById('labelsBody');
  body.innerHTML=labels.map(l=>`
    <div class="label-row" id="lrow-${l.id}">
      <span class="label-color-dot" style="background:${l.color_dot}" title="Mudar cor" onclick="openColorPicker(event,'${l.id}')"></span>
      <input class="label-name-input" value="${esc(l.name)}" maxlength="24"
        onblur="saveLabelName('${l.id}',this.value)"
        oninput="previewLabelName('${l.id}',this.value)" placeholder="Nome">
      <span class="label-preview" style="background:${l.color_bg};color:${l.color_text}" id="lprev-${l.id}">${esc(l.name)}</span>
      <button class="label-del" onclick="deleteLabel('${l.id}')">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M1.5 3.5h10M4.5 3.5V2.5h4v1M5 6v4M8 6v4M2.5 3.5l.8 7.2a1 1 0 0 0 1 .8h4.4a1 1 0 0 0 1-.8l.8-7.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>`).join('');
}

function previewLabelName(id,val){ const p=document.getElementById('lprev-'+id); if(p)p.textContent=val; }

async function saveLabelName(id,val){
  if(!val.trim()) return;
  const l=labels.find(x=>x.id===id);
  if(!l||l.name===val.trim()) return;
  await sb.from('labels').update({ name: val.trim() }).eq('id', id);
  l.name=val.trim();
}

async function addLabel(){
  if(!currentBoard) return;
  const dot=PALETTE[labels.length%PALETTE.length];
  const bg=hexAlpha(dot,0.15);
  const { data: newL, error }=await sb.from('labels').insert({ board_id: currentBoard.id, name:'Nova label', color_bg: bg, color_text: dot, color_dot: dot }).select().single();
  if(error){ toast('Erro ao criar label', true); return; }
  labels.push(newL);
  renderLabelsBody();
  const row=document.getElementById('lrow-'+newL.id);
  if(row){ const inp=row.querySelector('.label-name-input'); if(inp){inp.focus();inp.select();} }
}

async function deleteLabel(id){
  await sb.from('card_labels').delete().eq('label_id', id);
  await sb.from('labels').delete().eq('id', id);
  labels=labels.filter(l=>l.id!==id);
  Object.keys(cardLabels).forEach(cid=>{ cardLabels[cid]=(cardLabels[cid]||[]).filter(l=>l!==id); });
  renderLabelsBody();
  render();
}

/* ── Color picker ── */
function openColorPicker(e,labelId){
  e.stopPropagation(); colorTargetId=labelId;
  const pop=document.getElementById('colorPopover');
  const l=labels.find(x=>x.id===labelId);
  pop.innerHTML=PALETTE.map(c=>`<span class="color-swatch ${l?.color_dot===c?'selected':''}" style="background:${c}" onclick="applyColor('${c}')"></span>`).join('');
  pop.classList.add('show');
  pop.style.left=Math.min(e.clientX,window.innerWidth-180)+'px';
  pop.style.top =Math.min(e.clientY+8,window.innerHeight-180)+'px';
}

async function applyColor(hex){
  const l=labels.find(x=>x.id===colorTargetId);
  if(!l) return;
  const bg=hexAlpha(hex,0.15);
  l.color_dot=hex; l.color_text=hex; l.color_bg=bg;
  hideColorPopover();
  await sb.from('labels').update({ color_dot: hex, color_text: hex, color_bg: bg }).eq('id', l.id);
  renderLabelsBody();
  render();
}
function hideColorPopover(){ document.getElementById('colorPopover').classList.remove('show'); colorTargetId=null; }

.history-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:960;display:none;align-items:center;justify-content:center}
.history-modal-overlay.show{display:flex}
.history-modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);width:480px;max-width:95vw;max-height:85vh;box-shadow:0 24px 64px rgba(0,0,0,.7);display:flex;flex-direction:column;animation:modal-in .2s ease}
.history-body{padding:12px 16px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:2px}
.history-item{display:flex;align-items:flex-start;gap:10px;padding:8px 6px;border-radius:var(--r-sm);transition:background .1s}
.history-item:hover{background:var(--col)}
.history-icon{flex-shrink:0;margin-top:1px}
.history-content{flex:1;min-width:0}
.history-text{font-size:13px;line-height:1.4}
.history-meta{font-size:11px;color:var(--muted);margin-top:2px}
.history-avatar-sm{width:20px;height:20px;border-radius:50%;object-fit:cover;flex-shrink:0;margin-top:1px}
.history-initials-sm{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;flex-shrink:0;margin-top:1px}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 18px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:2000;transition:transform .25s ease;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- ── AUTH GATE ── -->
<div id="authGate">
  <div class="auth-logo">
    <svg width="24" height="24" viewBox="0 0 20 20" fill="none">
      <rect x="2" y="2" width="7" height="16" rx="2" fill="currentColor" opacity=".9"/>
      <rect x="11" y="2" width="7" height="10" rx="2" fill="currentColor" opacity=".5"/>
      <rect x="11" y="14" width="7" height="4" rx="2" fill="currentColor" opacity=".3"/>
    </svg>
    Kanban
  </div>
  <p class="auth-sub">Entre para acessar seus quadros</p>
  <button class="btn-google" onclick="signInGoogle()">
    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Entrar com Google
  </button>
  <div class="auth-loading hidden" id="authLoading">
    <div class="spinner"></div> Conectando…
  </div>
</div>

<!-- ── APP SHELL ── -->
<div class="app" id="appShell" style="display:none">

  <header class="header">
    <button class="header-logo-btn" id="logoBtn" onclick="toggleSidebar()">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
        <rect x="2" y="2" width="7" height="16" rx="2" fill="currentColor" opacity=".9"/>
        <rect x="11" y="2" width="7" height="10" rx="2" fill="currentColor" opacity=".5"/>
        <rect x="11" y="14" width="7" height="4" rx="2" fill="currentColor" opacity=".3"/>
      </svg>
      Board
      <svg class="chevron" width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M3 5l3.5 3.5L10 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="header-divider"></div>
    <input class="board-name-input" id="boardNameInput" value="" spellcheck="false" onchange="renameCurrent(this.value)">
    <div class="header-actions">
      <div class="presence-bar" id="presenceBar"></div>
      <span id="editingIndicator" class="editing-badge" style="display:none"></span>
      <span class="sync-dot" id="syncDot" title="Sincronizado"></span>
      <div class="header-divider"></div>
      <button class="btn btn-ghost btn-sm" onclick="openHistoryModal()">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.3"/><path d="M6.5 3.5v3l2 1.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        Histórico
      </button>
      <button class="btn btn-ghost btn-sm" onclick="openShareModal()">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><circle cx="10.5" cy="2.5" r="1.5" stroke="currentColor" stroke-width="1.2"/><circle cx="10.5" cy="10.5" r="1.5" stroke="currentColor" stroke-width="1.2"/><circle cx="2.5" cy="6.5" r="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M4 6.5l5-3.5M4 6.5l5 3.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        Compartilhar
      </button>
      <button class="btn btn-ghost btn-sm" onclick="openLabelsModal()">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M1.5 7.5 6 12l5.5-5.5V2H7L1.5 7.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="8.5" cy="4.5" r="1" fill="currentColor"/></svg>
        Labels
      </button>
      <button class="btn btn-ghost btn-sm" onclick="openAddCol()">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 1.5v10M1.5 6.5h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Coluna
      </button>
      <button class="btn btn-primary btn-sm" onclick="openNewCard()">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1v10M1 6h10" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
        Novo card
      </button>
      <div id="userAvatarWrap">
        <button onclick="openUserMenu(event)" style="background:none;border:none;cursor:pointer;padding:0" id="userAvatarBtn"></button>
      </div>
    </div>
  </header>

  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <aside class="board-sidebar" id="boardSidebar">
    <div class="sidebar-head">
      <h3>Quadros</h3>
      <button class="sidebar-close" onclick="closeSidebar()">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 2l10 10M12 2 2 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="sidebar-search">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="5" cy="5" r="3.5" stroke="#7B82A0" stroke-width="1.3"/><path d="M8 8 10.5 10.5" stroke="#7B82A0" stroke-width="1.3" stroke-linecap="round"/></svg>
      <input type="text" placeholder="Buscar quadro…" oninput="filterBoards(this.value)" id="boardSearchInput">
    </div>
    <div class="board-list" id="boardList"></div>
    <div class="sidebar-footer">
      <button class="create-board-btn" onclick="showCreateForm()">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 1.5v10M1.5 6.5h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Novo quadro
      </button>
      <div class="create-board-form" id="createBoardForm">
        <input type="text" id="newBoardInput" placeholder="Nome do quadro…" onkeydown="createBoardKey(event)">
        <div class="create-board-actions">
          <button class="btn btn-primary btn-sm" onclick="createBoard()">Criar</button>
          <button class="btn btn-ghost btn-sm" onclick="hideCreateForm()">Cancelar</button>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="toolbar">
      <div class="search">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><circle cx="5.5" cy="5.5" r="3.5" stroke="#7B82A0" stroke-width="1.5"/><path d="M8.5 8.5 11 11" stroke="#7B82A0" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input id="searchInput" type="text" placeholder="Buscar cards…" oninput="render()" autocomplete="off">
      </div>
      <button class="filter-chip" id="chipHigh" onclick="toggleFilter('high',this)">
        <span style="width:7px;height:7px;border-radius:2px;background:var(--red);display:inline-block"></span>Alta
      </button>
      <button class="filter-chip" id="chipMedium" onclick="toggleFilter('medium',this)">
        <span style="width:7px;height:7px;border-radius:2px;background:#FBBF24;display:inline-block"></span>Média
      </button>
      <button class="filter-chip" id="chipLow" onclick="toggleFilter('low',this)">
        <span style="width:7px;height:7px;border-radius:2px;background:#34D399;display:inline-block"></span>Baixa
      </button>
      <div class="toolbar-right">
        <button class="btn btn-ghost" style="font-size:12px" onclick="clearFilters()">Limpar</button>
      </div>
    </div>
    <div class="board" id="board"></div>
  </main>
</div>

<!-- CTX MENU -->
<div class="ctx-menu" id="ctxMenu"></div>

<!-- CARD MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head"><h2 id="modalTitle">Novo card</h2><button class="modal-close" onclick="closeModal()"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M2 2l11 11M13 2 2 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Título *</label><input class="form-input" id="mTitle" placeholder="Nome do card"></div>
      <div class="form-group"><label class="form-label">Descrição</label><textarea class="form-input form-textarea" id="mDesc" placeholder="Detalhes, links, anotações…"></textarea></div>
      <div class="form-group"><label class="form-label">Coluna</label><select class="form-input" id="mCol"></select></div>
      <div class="form-group">
        <label class="form-label">Prioridade</label>
        <div class="priority-picker">
          <button class="prio-btn p-high" data-p="high" onclick="selectPriority(this)"><span style="width:7px;height:7px;border-radius:2px;background:currentColor;display:inline-block"></span>Alta</button>
          <button class="prio-btn p-medium selected" data-p="medium" onclick="selectPriority(this)"><span style="width:7px;height:7px;border-radius:2px;background:currentColor;display:inline-block"></span>Média</button>
          <button class="prio-btn p-low" data-p="low" onclick="selectPriority(this)"><span style="width:7px;height:7px;border-radius:2px;background:currentColor;display:inline-block"></span>Baixa</button>
        </div>
      </div>
      <div class="form-group"><label class="form-label">Labels</label><div class="tag-picker" id="tagPicker"></div></div>
      <div class="form-group"><label class="form-label">Data de entrega</label><input class="form-input" id="mDate" type="date"></div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveCard()">Salvar</button></div>
  </div>
</div>

<!-- LABELS MODAL -->
<div class="labels-modal-overlay" id="labelsOverlay">
  <div class="labels-modal">
    <div class="labels-head"><h2>Gerenciar Labels</h2><button class="modal-close" onclick="closeLabelsModal()"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M2 2l11 11M13 2 2 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
    <div class="labels-body" id="labelsBody"></div>
    <div class="labels-footer">
      <button class="add-label-btn" onclick="addLabel()"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 1.5v10M1.5 6.5h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Adicionar label</button>
      <button class="btn btn-primary btn-sm" onclick="closeLabelsModal()">Feito</button>
    </div>
  </div>
</div>

<!-- SHARE MODAL -->
<div class="modal-overlay" id="shareOverlay">
  <div class="modal" style="width:440px">
    <div class="modal-head"><h2>Compartilhar quadro</h2><button class="modal-close" onclick="closeShareModal()"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M2 2l11 11M13 2 2 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
    <div class="modal-body" style="gap:14px">
      <div class="form-group">
        <label class="form-label">Link do quadro</label>
        <div class="share-link-box"><input type="text" id="shareLinkInput" readonly><button class="btn btn-ghost btn-sm" onclick="copyShareLink()">Copiar</button></div>
      </div>
      <p style="font-size:12px;color:var(--muted);line-height:1.5">Qualquer pessoa autenticada com este link pode ver e editar o quadro.</p>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeShareModal()">Fechar</button></div>
  </div>
</div>

<!-- HISTORY MODAL -->
<div class="history-modal-overlay" id="historyOverlay">
  <div class="history-modal">
    <div class="modal-head"><h2>Histórico de atividade</h2><button class="modal-close" onclick="closeHistoryModal()"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M2 2l11 11M13 2 2 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
    <div class="history-body" id="historyBody"></div>
  </div>
</div>

<!-- COLOR POPOVER -->
<div class="color-popover" id="colorPopover"></div>
<!-- TOAST -->
<div class="toast" id="toast"></div>

<!--
══════════════════════════════════════════════════════════════════
  GUIA DE CONFIGURAÇÃO — SUPABASE
  Siga estes passos na ordem antes de publicar no GitHub Pages.
══════════════════════════════════════════════════════════════════

PASSO 1 — Criar projeto no Supabase
  1. Acesse https://supabase.com e clique em "Start your project"
  2. Crie uma organização (ou use uma existente)
  3. Clique em "New project", dê um nome, defina senha do banco e
     escolha a região mais próxima (ex: South America - São Paulo)
  4. Aguarde o projeto provisionar (~2 min)

PASSO 2 — Criar as tabelas (SQL Editor)
  No menu lateral: SQL Editor → New query → cole e execute:

  ─────────────────────────────────────────────────────────────
  -- Habilita UUID
  create extension if not exists "pgcrypto";

  -- BOARDS
  create table boards (
    id         uuid primary key default gen_random_uuid(),
    name       text not null,
    owner_id   uuid references auth.users(id) on delete cascade,
    created_at timestamptz default now()
  );

  -- COLUNAS
  create table board_cols (
    id         uuid primary key default gen_random_uuid(),
    board_id   uuid references boards(id) on delete cascade,
    title      text not null,
    color      text default '#7B82A0',
    position   int  default 0,
    created_at timestamptz default now()
  );

  -- CARDS
  create table cards (
    id         uuid primary key default gen_random_uuid(),
    board_id   uuid references boards(id) on delete cascade,
    col_id     uuid references board_cols(id) on delete cascade,
    title      text not null,
    desc       text,
    priority   text default 'medium',
    due_date   date,
    position   int  default 0,
    created_by uuid references auth.users(id),
    created_at timestamptz default now()
  );

  -- LABELS
  create table labels (
    id          uuid primary key default gen_random_uuid(),
    board_id    uuid references boards(id) on delete cascade,
    name        text not null,
    color_bg    text default '#1E1A40',
    color_text  text default '#A78BFA',
    color_dot   text default '#A78BFA',
    created_at  timestamptz default now()
  );

  -- CARD <-> LABELS (many-to-many)
  create table card_labels (
    card_id   uuid references cards(id) on delete cascade,
    label_id  uuid references labels(id) on delete cascade,
    board_id  uuid references boards(id) on delete cascade,
    primary key (card_id, label_id)
  );

  -- HISTÓRICO
  create table history (
    id          uuid primary key default gen_random_uuid(),
    board_id    uuid references boards(id) on delete cascade,
    user_id     uuid references auth.users(id),
    user_name   text,
    user_photo  text,
    action      text,
    detail      text,
    created_at  timestamptz default now()
  );
  ─────────────────────────────────────────────────────────────

PASSO 3 — Habilitar Realtime nas tabelas
  Menu lateral: Database → Replication → Tables
  Ative "Realtime" para: boards, board_cols, cards, labels, card_labels, history

PASSO 4 — Configurar Row Level Security (RLS)
  SQL Editor → New query → cole e execute:

  ─────────────────────────────────────────────────────────────
  -- Habilita RLS em todas as tabelas
  alter table boards     enable row level security;
  alter table board_cols enable row level security;
  alter table cards      enable row level security;
  alter table labels     enable row level security;
  alter table card_labels enable row level security;
  alter table history    enable row level security;

  -- Políticas: usuário autenticado lê e escreve tudo
  -- (ajuste para multi-tenant mais granular se precisar)
  create policy "auth_all" on boards      for all to authenticated using (true) with check (true);
  create policy "auth_all" on board_cols  for all to authenticated using (true) with check (true);
  create policy "auth_all" on cards       for all to authenticated using (true) with check (true);
  create policy "auth_all" on labels      for all to authenticated using (true) with check (true);
  create policy "auth_all" on card_labels for all to authenticated using (true) with check (true);
  create policy "auth_all" on history     for all to authenticated using (true) with check (true);
  ─────────────────────────────────────────────────────────────

PASSO 5 — Ativar Auth com Google
  Menu lateral: Authentication → Providers → Google → Enable
  Você precisará de um projeto no Google Cloud Console:
    1. https://console.cloud.google.com → APIs & Services → Credentials
    2. Crie um OAuth 2.0 Client ID (Web application)
    3. Em "Authorized redirect URIs" adicione:
       https://SEU-PROJECT-ID.supabase.co/auth/v1/callback
    4. Copie Client ID e Client Secret de volta para o Supabase
  Em Authentication → URL Configuration:
    Site URL: https://SEU-USUARIO.github.io/SEU-REPO/
    Redirect URLs: adicione o mesmo URL acima

PASSO 6 — Copiar credenciais para o index.html
  Menu lateral: Settings → API
  Copie:
    • Project URL  → cole em SUPABASE_URL
    • anon / public key → cole em SUPABASE_ANON_KEY
  (no topo do <script type="module"> deste arquivo)

PASSO 7 — Publicar no GitHub Pages
  1. Renomeie este arquivo para index.html
  2. Commit + push para branch main do seu repositório
  3. Settings → Pages → Source: Deploy from branch → main → / (root)
  4. Acesse: https://SEU-USUARIO.github.io/SEU-REPO/

══════════════════════════════════════════════════════════════════
-->
</body>
</html>
